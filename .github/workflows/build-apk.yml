name: Build APK

on:
  push:
    branches: [claude/upload-battle-report-CyhPM]
    paths: [twa-app/**, .github/workflows/build-apk.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null | tail -5
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null | tail -5

      - name: Build debug APK
        working-directory: twa-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-reports-apk
          path: twa-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
