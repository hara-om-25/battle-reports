name: Build Local APK

on:
  push:
    branches:
      - claude/sdk-development-rF2In
    paths:
      - 'local.html'
      - 'local-app/**'
      - '.github/workflows/build-local-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android build tools and platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Copy local.html to app assets
        run: |
          mkdir -p local-app/app/src/main/assets
          cp local.html local-app/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: local-app
        run: gradle assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-reports-local-debug
          path: local-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
