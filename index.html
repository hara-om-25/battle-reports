    <script>
const SHIELD_SVG = `<svg class="shield-svg" width="40" height="50" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><path d="M 5,5 L 95,5 L 95,80 Q 95,115 50,135 Q 5,115 5,80 Z" fill="#0057b7" stroke="#ffd700" stroke-width="3"/><g fill="#ffd700"><polygon points="48,20 52,20 53,75 50,90 47,75"/><polygon points="20,35 28,35 30,75 38,90 38,100 28,100 28,92 20,80"/><polygon points="80,35 72,35 70,75 62,90 62,100 72,100 72,92 80,80"/><polygon points="32,30 40,40 40,85 32,75"/><polygon points="68,30 60,40 60,85 68,75"/><rect x="28" y="70" width="44" height="6"/><rect x="44" y="90" width="12" height="20"/><rect x="40" y="105" width="20" height="5"/><polygon points="46,110 54,110 52,118 48,118"/></g></svg>`;


const CLIENT_ID = '1095528804215-gjcnuo3oc12osqm596dpda81slodrmvs.apps.googleusercontent.com';
let SHEET_ID = localStorage.getItem('sheetId') || '16C9nHIQx_39ZqXbLHuqlmVYxrpHyf0XEDJW8HLnJMzs';

let state = {
    page: 'login', user: null, token: null, loaded: false,
    scoreTable: {}, drones: [], ammo: [], results: [], records: [],
    report: 1, counts: {},
    form: {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:'', selTargetName:''},
    selReport: null, selDate: null, selVylotyDate: null, archiveSheets: [], selArchive: null, archiveRecs: [], archiveLoading: false, pvr: [], allArchiveRecs: [], allArchiveLoaded: false, allArchiveLoading: false,
    inputVal: '', inputList: null, inputIdx: null, editVal: '', filterFrom: '', filterTo: '', filterPeriodOpen: false, filterPeriodShown: false, zvityFilterFrom: '', zvityFilterTo: '', zvityFilterOpen: false, zvityFilterShown: false
};

let tokenClient = null;

/* ============ ОФЛАЙН-ЯДРО ============ */
const LS_DATA = 'br_offline_data', LS_QUEUE = 'br_offline_queue';
state.online = navigator.onLine;
state.queue = [];          // [{op:'add'|'edit'|'del', uid, rec}]
state.syncing = false;
state.archiveOffline = false;

function _newUid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// Детермінований uid для старих записів без колонки K — однаковий локально й у таблиці
function _contentUid(r) {
    const s = (r.datetime||'')+'|'+(r.target||'')+'|'+(r.coordinates||'')+'|'+(r.result||'')+'|'+(r.qty200||0)+'|'+(r.qty300||0)+'|'+(r.reportNum||0);
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return 'c' + (h >>> 0).toString(36);
}

// Запис ще не потрапив у таблицю, якщо він висить у черзі (додано або змінено офлайн)
function _isPendingRec(r) {
    if (!r || !state.queue || !state.queue.length) return false;
    const u = r.uid || _contentUid(r);
    return state.queue.some(o => o.uid === u && o.op !== 'del');
}

// Значення списку ще не потрапило в таблицю, якщо його немає в останньому
// успішно синхронізованому знімку (додане або відредаговане офлайн)
function _isPendingListVal(list, val) {
    const snap = state.listsSynced;
    if (!snap || !snap[list]) return false;
    return snap[list].indexOf(val) === -1;
}

function _markListsSynced() {
    state.listsSynced = {
        drones: (state.drones || []).slice(),
        ammo: (state.ammo || []).slice(),
        results: (state.results || []).slice()
    };
}

function saveLocal() {
    try {
        localStorage.setItem(LS_DATA, JSON.stringify({
            owner: state.user || localStorage.getItem('email') || '',
            records: state.records, report: state.report, counts: state.counts,
            scoreTable: state.scoreTable, drones: state.drones, ammo: state.ammo,
            results: state.results, pvr: state.pvr, reportTitle: state.reportTitle,
            costPerPoint: state.costPerPoint, droneCategories: state.droneCategories,
            archiveSheets: state.archiveSheets, listsSynced: state.listsSynced
        }));
        localStorage.setItem(LS_QUEUE, JSON.stringify(state.queue));
    } catch (e) { /* сховище переповнене — ігноруємо */ }
}

function loadLocal() {
    try {
        const d = JSON.parse(localStorage.getItem(LS_DATA) || 'null');
        if (d) {
            state.records = d.records || [];
            state.report = d.report || 1;
            state.counts = d.counts || {};
            state.scoreTable = d.scoreTable || {};
            state.drones = d.drones || [];
            state.ammo = d.ammo || [];
            state.results = d.results || [];
            state.pvr = d.pvr || [];
            state.reportTitle = d.reportTitle || '';
            state.costPerPoint = d.costPerPoint || 0;
            state.droneCategories = d.droneCategories || null;
            state.archiveSheets = d.archiveSheets || [];
            state.listsSynced = d.listsSynced || null;
        }
        state.queue = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]');
    } catch (e) { state.queue = []; }
}

// Згортання черги: add+edit=add, add+del=нічого, edit+del=del
function queueOp(op, uid, rec) {
    const existing = state.queue.findIndex(o => o.uid === uid);
    if (op === 'edit' && existing >= 0 && state.queue[existing].op === 'add') {
        state.queue[existing].rec = rec;
    } else if (op === 'del' && existing >= 0 && state.queue[existing].op === 'add') {
        state.queue.splice(existing, 1);
    } else if (existing >= 0 && state.queue[existing].op !== 'add') {
        state.queue[existing] = { op, uid, rec };
    } else {
        state.queue.push({ op, uid, rec });
    }
    saveLocal();
}

function _isNetErr(e) {
    const m = (e && e.message || '').toLowerCase();
    return !navigator.onLine || m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed');
}

// Запис змінено локально: онлайн — одразу в таблицю, офлайн — у чергу
async function pushChange(op, uid, rec) {
    if (!state.online || !navigator.onLine) { queueOp(op, uid, rec); saveLocal(); return; }
    try {
        await syncRecordsToAPI();
        saveLocal();
    } catch (e) {
        if (_isNetErr(e)) { state.online = false; queueOp(op, uid, rec); }
        else showAlert('Помилка: ' + e.message);
        saveLocal();
    }
}

// Накладає локальні незбережені зміни поверх набору записів.
// Ключове: нові записи беруться З ЧЕРГИ, а не зі state.records —
// тому вони не зникають, навіть якщо state.records перезаписали даними з таблиці.
function _applyQueue(base) {
    if (!state.queue.length) return base;
    const delU = new Set(state.queue.filter(o => o.op === 'del').map(o => o.uid));
    const editM = new Map(state.queue.filter(o => o.op === 'edit').map(o => [o.uid, o.rec]));
    const out = [], seen = new Set();
    base.forEach(r => {
        if (!r.uid) r.uid = _contentUid(r);
        if (delU.has(r.uid) || seen.has(r.uid)) return;
        seen.add(r.uid);
        out.push(editM.has(r.uid) ? Object.assign({}, editM.get(r.uid), { uid: r.uid }) : r);
    });
    state.queue.filter(o => o.op === 'add').forEach(o => {
        if (delU.has(o.uid) || seen.has(o.uid) || !o.rec) return;
        seen.add(o.uid);
        out.push(Object.assign({}, o.rec, { uid: o.uid }));
    });
    editM.forEach((rec, uid) => {
        if (seen.has(uid) || delU.has(uid) || !rec) return;
        seen.add(uid);
        out.push(Object.assign({}, rec, { uid: uid }));
    });
    return out;
}

// Повне звіряння в обидва боки: нічого не губиться
async function reconcileSync() {
    const mainRows = await apiGet('ГОЛОВНА');
    const remote = _parseMainRows(mainRows);
    const delUids = new Set(state.queue.filter(o => o.op === 'del').map(o => o.uid));
    // 1) те що в таблиці + усі локальні незбережені зміни (нові беруться з черги)
    const merged = _applyQueue(remote);
    const seen = new Set(merged.map(r => r.uid));
    // 2) все що є в пам'яті, але відсутнє і там, і там
    state.records.forEach(r => {
        if (!r.uid) r.uid = _contentUid(r);
        if (delUids.has(r.uid) || seen.has(r.uid)) return;
        seen.add(r.uid);
        merged.push(r);
    });
    const _k = s => { const [d, m, y] = (s || '').split(' ')[0].replace(',', '').split('.'); return (y || '') + (m || '').padStart(2, '0') + (d || '').padStart(2, '0'); };
    merged.sort((a, b) => _k(a.datetime) < _k(b.datetime) ? -1 : _k(a.datetime) > _k(b.datetime) ? 1 : 0);
    state.records = merged;
    await syncRecordsToAPI();
    state.queue = [];
    saveLocal();
}

}

async function onBackOnline() {
    if (state.online || state.syncing) return;
    state.online = true; state.syncing = true; render();
    // Спершу пробуємо синхронізувати наявним токеном — це найшвидший шлях
    try {
        await reconcileSync();
        state.syncing = false;
        showAlert('✅ З\'ЄДНАННЯ ВІДНОВЛЕНО\n\nПеревірку пройдено.\nДані синхронізовані з Google таблицею.');
        render();
        return;
    } catch (e) {
        if (_isNetErr(e)) { state.online = false; state.syncing = false; render(); return; }
    }
    // Не вийшло — найімовірніше протермінувався токен, поки не було мережі.
    // Бібліотека Google могла не завантажитись при офлайн-старті — підвантажуємо її.
    if (typeof google === 'undefined' || !google.accounts) {
        await new Promise(res => {
            const s = document.createElement('script');
            s.src = 'https://accounts.google.com/gsi/client';
            s.onload = res; s.onerror = res;
            document.head.appendChild(s);
            setTimeout(res, 6000);
        });
        if (typeof google !== 'undefined' && google.accounts && !tokenClient) initAuth();
    }
    {
        state.syncing = false;
        if (state.user && tokenClient) {
            window._pendingSync = true;
            tokenClient.requestAccessToken({ prompt: '', hint: state.user });
        } else {
            showAlert('Не вдалося синхронізувати автоматично.\n\nДані збережені локально — натисніть кнопку завантаження щоб повторити.');
        }
        render();
    }
}

// Тейваз — записати та синхронізувати дані в Google таблицю
async function manualPush() {
    if (state.syncing) return;
    if (!navigator.onLine) { state.online = false; render(); _offlineMsg(); return; }
    state.syncing = true; render();
    try {
        await reconcileSync();
        state.online = true;
        showAlert('✅ Дані записані та синхронізовані з таблицею!');
    } catch (e) {
        if (_isNetErr(e)) { state.online = false; _offlineMsg(); }
        else showAlert('⚠️ Помилка синхронізації: ' + e.message);
    } finally {
        state.syncing = false; render();
    }
}

// email — зчитати та синхронізувати дані з Google таблиці
async function manualPull() {
    if (state.syncing) return;
    if (!navigator.onLine) { state.online = false; render(); _offlineMsg(); return; }
    state.syncing = true; render();
    try {
        if (state.queue.length) await reconcileSync();   // спершу віддати локальні зміни
        await loadDataFromAPI();
        state.online = true;
        state.syncing = false;
        showAlert('✅ Дані зчитані та синхронізовані з таблицею!');
    } catch (e) {
        state.syncing = false;
        if (_isNetErr(e)) { state.online = false; _offlineMsg(); }
        else showAlert('⚠️ Помилка: ' + e.message);
        render();
    }
}

window.onload = () => {
    loadLocal();
    const savedToken = localStorage.getItem('token');
    const savedEmail = localStorage.getItem('email');
    state.online = navigator.onLine;

    // МАЛЮЄМО ОДРАЗУ — жодного порожнього екрана, ні онлайн, ні офлайн
    if (savedEmail) {
        state.user = savedEmail;
        state.token = savedToken;
        state.loaded = true;
        state.page = 'form';
        render();
        if (!navigator.onLine) _offlineMsg();
    } else {
        state.page = 'login';
        render();
        // Вийшли з акаунту, але на пристрої лишились несинхронізовані записи
        if (!navigator.onLine && state.queue.length) {
            showAlert('НЕМАЄ ІНТЕРНЕТ-З\'ЄДНАННЯ\n\nНа пристрої збережено ' + state.queue.length + ' записів.\n\nВони не зникнуть. Увійдіть тим самим акаунтом, коли з\'явиться інтернет — записи автоматично потраплять у таблицю.');
        }
    }

    let _waited = 0;
    const initInterval = setInterval(() => {
        if (typeof google !== 'undefined' && google.accounts) {
            clearInterval(initInterval);
            initAuth();
            if (savedToken && savedEmail && navigator.onLine) verifyAndLoad();
            return;
        }
        // бібліотека Google не вантажиться (немає мережі) — залишаємось на локальних даних
        if (++_waited > 60) {
            clearInterval(initInterval);
            if (!navigator.onLine) { state.online = false; render(); }
        }
    }, 100);
};

async function verifyAndLoad() {
    try {
        const usersResp = await fetch(
            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent('@')}!A:A`,
            { headers: { 'Authorization': `Bearer ${state.token}` } }
        ).then(r => r.json());
        
        if (usersResp.error) {
            if (usersResp.error.code === 401 || usersResp.error.status === 'UNAUTHENTICATED') {
                state.token = null; state.loaded = false;
                if (tokenClient) { tokenClient.requestAccessToken({ prompt: '', hint: state.user||'' }); return; }
                logout(); return;
            }
            showAlert('Помилка доступу до файла: ' + usersResp.error.message);
            logout(); return;
        }
        
        // Дані на пристрої належать іншому акаунту — не змішуємо
        try {
            const _d = JSON.parse(localStorage.getItem(LS_DATA) || 'null');
            if (_d && _d.owner && _d.owner !== state.user) {
                localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_QUEUE);
                state.queue = []; state.records = [];
            }
        } catch (e) {}

        const users = (usersResp.values || []).flat().map(x => (x||'').trim().toLowerCase()).filter(x => x);
        const userEmail = (state.user || '').trim().toLowerCase();
        if (!users.includes(userEmail)) {
            showAlert('У вас немає доступу!\nВаш email: ' + state.user);
            logout(); return;
        }
        
        await loadDataFromAPI();
    } catch(err) {
        // Немає мережі — стартуємо в офлайн-режимі з локальними даними
        if (_isNetErr(err) && localStorage.getItem('email')) {
            state.online = false;
            state.loaded = true; state.page = 'form';
            render();
            _offlineMsg();
            return;
        }
        showAlert('Помилка перевірки: ' + err.message);
        logout();
    }
}

function _startTokenTimer() {
    if(window._tokenTimer)clearInterval(window._tokenTimer);
    window._tokenTimer=setInterval(()=>{
        if(state.token&&state.user&&tokenClient)tokenClient.requestAccessToken({prompt:'',hint:state.user});
    },45*60*1000);
    localStorage.setItem('_lastRefresh',Date.now().toString());
}
document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&state.token&&state.user&&tokenClient){
        const _last=parseInt(localStorage.getItem('_lastRefresh')||'0');
        if(Date.now()-_last>44*60*1000)tokenClient.requestAccessToken({prompt:'',hint:state.user});

});
function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',
        callback: async (response) => {
            if (response.error) {
                showAlert('Помилка авторизації: ' + response.error);
                return;
            }
            state.token = response.access_token;
            localStorage.setItem('token', state.token);
            if (window._pendingSync) {
                window._pendingSync = false;
                _startTokenTimer();
                try {
                    await reconcileSync();
                    state.online = true;
                    showAlert('✅ З\'ЄДНАННЯ ВІДНОВЛЕНО\n\nПеревірку пройдено.\nДані синхронізовані з Google таблицею.');
                } catch (e) {
                    showAlert('Не вдалося синхронізувати: ' + e.message + '\n\nДані збережені локально. Натисніть кнопку завантаження щоб повторити.');
                }
                render();
                return;
            }
            if (state.user && state.loaded) {
                _startTokenTimer(); return;
            }
            try {
                if (!state.user) {
                    const userInfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { 'Authorization': `Bearer ${state.token}` }
                    }).then(r => r.json());
                    state.user = userInfo.email;
                    localStorage.setItem('email', state.user);
                }
                _startTokenTimer();
                await verifyAndLoad();
            } catch(err) {
                showAlert('Помилка: ' + err.message);
                logout();
            }
        }
    });
}

// Час вильоту в хвилинах від початку доби — для впорядкування списків
function _recMinutes(r) {
    const m = (r.datetime || '').match(/(\d{1,2}):(\d{2})/);
    return m ? (+m[1]) * 60 + (+m[2]) : 0;
}
// Вильоти за зростанням часу; за однакового часу зберігається початковий порядок
function _byTime(recs) {
    return [...recs].sort((a, b) => _recMinutes(a) - _recMinutes(b));
}
// Найновіші згори — з точністю до секунд (для вкладки ЗВІТИ, на відміну від таблиці, де найновіші знизу)
function _byTimeDesc(recs) {
    return [...recs].sort((a, b) => {
        const ka = _fullDT(a), kb = _fullDT(b);
        return ka < kb ? 1 : ka > kb ? -1 : 0;
    });
}

function getDateOnly(datetime) {
    if (!datetime) return '';
    return datetime.split(' ')[0].replace(',', '').trim();
}

// Розбір рядків ГОЛОВНА. Колонка K = uid; для старих записів без неї — детермінований uid
function _parseMainRows(rows) {
    const out = [];
    for (let i = 1; i < (rows || []).length; i++) {
        const row = rows[i] || [];
        if (row[0] || row[2] || row[5] || row[6] || row[7] || row[8]) {
            const rec = {
                reportNum: parseInt(row[0]) || 0,
                datetime: row[1] || '',
                target: row[2] || '',
                qty200: parseInt(row[3]) || 0,
                qty300: parseInt(row[4]) || 0,
                coordinates: row[5] || '',
                drone: (row[6] || '').trim(),
                ammo: (row[7] || '').trim(),
                result: row[8] || '',
                points: parseFloat(row[9]) || 0
            };
            rec.uid = (row[10] || '').trim() || _contentUid(rec);
            out.push(rec);
        }
    }
    return out;
}

function _fmtNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function _calcDroneCost(recs) {
    const dc = state.droneCategories;
    if(!dc) return 0;
    const cnt = {};
    let noDrone = 0;
    recs.forEach(r => { if(r.drone) cnt[r.drone] = (cnt[r.drone]||0) + 1; else noDrone++; });
    const _has = (name, kw) => kw && name.toLowerCase().includes(kw.toLowerCase());
    let total = noDrone * (dc.costBase + dc.costPerDrone);
    Object.entries(cnt).forEach(([name, n]) => {
        let type;
        if(_has(name,dc.dualKw1)||_has(name,dc.dualKw2))       type = dc.costDual;
        else if(_has(name,dc.nightKw1)||_has(name,dc.nightKw2)) type = dc.costNight;
        else if(_has(name,dc.dayKw1)||_has(name,dc.dayKw2))     type = dc.costDay;
        else                                                      type = dc.costBase;

}

function calculatePoints(abbr, q200, q300, result) {
    if (abbr === 'ОС') {
        const os = state.scoreTable['ОС'] || {znyshcheno:0, poshkodzheno:0};
        if (result === 'знищено') return os.znyshcheno * (parseInt(q200)||0) + os.poshkodzheno * (parseInt(q300)||0);
        if (result === 'пошкоджено') return os.poshkodzheno * (parseInt(q300)||0);
        return 0;
    }
    const target = state.scoreTable[abbr];
    if (!target) return 0;
    if (result === 'знищено') return target.znyshcheno;
    if (result === 'пошкоджено') return target.poshkodzheno;
    return 0;

function _freqSortTargets(list) {
    const cnt = {};
    state.records.forEach(r => {
        if (!r.target) return;
        r.target.split(', ').forEach(t => {
            const p = t.trim().split(' ');
            const abbr = (/^\d+$/.test(p[p.length-1]) ? p.slice(0,-1).join(' ') : t.trim()).toUpperCase();
            if (abbr) cnt[abbr] = (cnt[abbr]||0)+1;
        });
    });
    return [...list].sort((a,b) => (cnt[b.toUpperCase()]||0)-(cnt[a.toUpperCase()]||0));
}
function _freqSort(list, field) {
    const cnt = {};
    state.records.forEach(r => { const v = r[field]; if (v) cnt[v] = (cnt[v]||0)+1; });
    return [...list].sort((a,b) => (cnt[b]||0)-(cnt[a]||0));
}
function _freqSortResults(list) {
    const cnt = {};
    state.records.forEach(r => { if (r.result) r.result.split(', ').forEach(x => { x=x.trim(); if(x) cnt[x]=(cnt[x]||0)+1; }); });
    return [...list].sort((a,b) => (cnt[b]||0)-(cnt[a]||0));
}

async function add() {
    if(state.form.targets.length === 0) {
        showAlert('Додайте результат вильоту, навіть якщо ціль не було уражено');
        return;
    }
    if(!state.form.drone || !state.form.ammo) {
        showAlert('Виберіть дрон та боєприпас!');
        return;
    }
    if(_osQtyMissing(state.form.targets.map(t=>({name: t.fullName || t.abbr, result: t.result})), state.form.q200, state.form.q300)) {
        showAlert('Додайте кількість ОС');
        return;
    }
    
    let totalPoints = 0;
    let targetStr = '';
    let resultStr = '';
    for(let i=0; i<state.form.targets.length; i++) {
        const t = state.form.targets[i];
        const pts = calculatePoints(t.abbr, state.form.q200, state.form.q300, t.result);
        totalPoints += pts;
        targetStr += (i>0?', ':'') + t.fullName;
        resultStr += (i>0?', ':'') + t.result;
    }
    
    const cleanedCoord = cleanCoords(state.form.coord);
    if(!state.form.targets.some(t=>t.abbr==='ОС')){state.form.q200=0;state.form.q300=0;}
    const rec = {
        reportNum: state.report,
        datetime: new Date().toLocaleString('uk-UA'),
        target: targetStr,
        qty200: state.form.q200,
        qty300: state.form.q300,
        coordinates: cleanedCoord,
        drone: state.form.drone,
        ammo: state.form.ammo,
        result: resultStr,
        points: totalPoints
    };
    rec.uid = _newUid();
    state.records.push(rec);
    state.form = {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:''};
    saveLocal();

    if (!state.online || !navigator.onLine) {
        queueOp('add', rec.uid, rec);
        state.online = false;
        showAlert('💾 Запис збережено локально (' + state.queue.length + ').\nСинхронізується після появи інтернету.');
        render();
        return;
    }
    try {
        await apiAppend('ГОЛОВНА!A:K', [[
            rec.reportNum, rec.datetime, rec.target,
            rec.qty200, rec.qty300,
            rec.coordinates, rec.drone, rec.ammo, rec.result,
            rec.points, rec.uid
        ]]);
        saveLocal();
        showAlert('✅ Запис додано і синхронізовано!');
    } catch(err) {
        queueOp('add', rec.uid, rec);
        if (_isNetErr(err)) {
            state.online = false;
            showAlert('💾 Запис збережено локально (' + state.queue.length + ').\nСинхронізується після появи інтернету.');
        } else {
            showAlert('⚠️ Запис додано локально, але не синхронізовано: ' + err.message);
        }
    }
    render();
}

// Повна дата+час вильоту як рядок yyyymmddHHMMSS — для хронологічного впорядкування рядків у таблиці
function _fullDT(r) {
    const p = (r.datetime || '').replace(',', '').trim().split(/\s+/);
    const [d, m, y] = (p[0] || '').split('.');
    const c = (p[1] || '').split(':');
    const hh = (c[0] || '0').padStart(2, '0'), mm = (c[1] || '0').padStart(2, '0'), ss = (c[2] || '0').padStart(2, '0');
    return (y || '0000').padStart(4, '0') + (m || '00').padStart(2, '0') + (d || '00').padStart(2, '0') + hh + mm + ss;
}

async function syncRecordsToAPI() {
    state.records.forEach(r => { if (!r.uid) r.uid = _contentUid(r); });
    await apiClear('ГОЛОВНА!A2:K');
    if (state.records.length > 0) {
        // Рядки в таблиці завжди йдуть хронологічно за датою й часом вильоту — найновіші внизу.
        // Це переставляє рядок і тоді, коли в РЕДАГУВАННІ змінили час: він переїде на своє місце.
        const _sorted = [...state.records].sort((a, b) => {
            const ka = _fullDT(a), kb = _fullDT(b);
            return ka < kb ? -1 : ka > kb ? 1 : 0;
        });
        const rows = _sorted.map(r => [
            r.reportNum, r.datetime, r.target,
            r.qty200, r.qty300,
            r.coordinates, r.drone, r.ammo, r.result,
            r.points, r.uid
        ]);
        await apiUpdate(`ГОЛОВНА!A2:K${rows.length + 1}`, rows);
    }
}

function addEditTarget() {
    const er = state.editRecord;
    if (!er || !er.newResult) return;
    saveEditModalState();
    const abbr = er.newTarget;
    if (abbr === 'ОС') {
        if (er.newResult === 'знищено' && !(er.qty200 > 0)) { showAlert('Додайте кількість ОС'); return; }
        if (er.newResult === 'пошкоджено' && !(er.qty300 > 0)) { showAlert('Додайте кількість ОС'); return; }
    }
    let name = '';
    if (abbr) {
        let maxN = 0;
        const _gA = s => { const _p=s.split(' '),_l=_p[_p.length-1],_r=/^\d+$/.test(_l)?_p.slice(0,-1).join(' '):s,_u=_r.toUpperCase(); return (Object.keys(state.scoreTable).find(k=>k.toUpperCase()===_u)||(()=>{const _lo=_r.toLowerCase();for(const[_a,_d]of Object.entries(state.scoreTable))if(_d.fullName&&_d.fullName.toLowerCase()===_lo)return _a;return _r;})()).toUpperCase(); };
        const _gN = s => { const _p=s.split(' '),_l=_p[_p.length-1]; return /^\d+$/.test(_l)?parseInt(_l):0; };
        state.records.filter((r,i)=>r.reportNum===state.report&&i!==er.idx).forEach(r=>{
            (r.target||'').split(', ').forEach(t=>{ if(_gA(t.trim())===abbr.toUpperCase())maxN=Math.max(maxN,_gN(t.trim())); });
        });
        er.targets.forEach(t=>{ if(_gA(t.name.trim())===abbr.toUpperCase())maxN=Math.max(maxN,_gN(t.name.trim())); });
        name = abbr + ' ' + (maxN + 1);
    }
    if(er.selTargetName){ name=er.selTargetName; }
    er.selTargetName='';
    er.targets.push({name, result: er.newResult});
    er.newTarget = ''; er.newResult = '';
    renderEditRecordModal();
}

async function saveEditRecord() {
    const er = state.editRecord;
    if (!er) return;
    saveEditModalState();
    if (_osQtyMissing(er.targets, er.qty200, er.qty300)) { showAlert('Додайте кількість ОС'); return; }
    const r = state.records[er.idx];
    r.target = er.targets.map(t => t.name).join(', ');
    r.result = er.targets.map(t => t.result).join(', ');
    r.coordinates = er.coordinates;
    const _erHasOs = er.targets.some(t => _abbrOfName(t.name) === 'ОС');
    if (!_erHasOs) { er.qty200=0; er.qty300=0; }
    r.qty200 = er.qty200;
    r.qty300 = er.qty300;
    r.drone = er.drone;
    r.ammo = er.ammo;
    const _osE=state.scoreTable['ОС']||{znyshcheno:0,poshkodzheno:0};
    let _ptsE=0;
    er.targets.forEach(t=>{const _p=t.name.trim().split(' '),_l=_p[_p.length-1],_r=/^\d+$/.test(_l)?_p.slice(0,-1).join(' '):t.name.trim(),_u=_r.toUpperCase();const _ab=Object.keys(state.scoreTable).find(k=>k.toUpperCase()===_u)||(()=>{const _lo=_r.toLowerCase();for(const[_a,_d]of Object.entries(state.scoreTable))if(_d.fullName&&_d.fullName.toLowerCase()===_lo)return _a;return _r;})();if(_ab==='ОС'){if(t.result==='знищено')_ptsE+=_osE.znyshcheno*(parseInt(er.qty200)||0)+_osE.poshkodzheno*(parseInt(er.qty300)||0);else if(t.result==='пошкоджено')_ptsE+=_osE.poshkodzheno*(parseInt(er.qty300)||0);}else{const _sc=state.scoreTable[_ab];if(_sc)_ptsE+=t.result==='знищено'?_sc.znyshcheno:t.result==='пошкоджено'?_sc.poshkodzheno:0;}});
    r.points=Math.round(_ptsE*100)/100;
    // Час вильоту: підставляємо обраний, дату й секунди лишаємо як були
    if (er.hour != null && er.minute != null) {
        const _p = (r.datetime || '').replace(',', '').trim().split(/\s+/);
        const _date = _p[0] || '';
        const _sec = ((_p[1] || '').split(':')[2]) || '00';
        if (_date) r.datetime = _date + ', ' + er.hour + ':' + er.minute + ':' + _sec;
    }
    if (!r.uid) r.uid = _contentUid(r);
    state.editRecord = null;
    closeModal(); render();
    await pushChange('edit', r.uid, Object.assign({}, r));
    render();
}

function generateReport(dayRecs) {
    let lines = [];
    lines.push('Доповідаю!');
    lines.push('');
    const date = getDateOnly(dayRecs[0].datetime);
    const reportTitle = state.reportTitle || 'ТГ невідомий';
    const totalPoints = Math.round(dayRecs.reduce((s, r) => s + (parseFloat(r.points) || 0), 0));
    lines.push(date+'р.,Тг., "'+reportTitle+'" здійснено '+dayRecs.length+' вильотів, уражено.');
    const hasOs = dayRecs.some(r => r.target.split(', ').some(t => t.trim().toLowerCase().startsWith('ос')));
    const osSum200 = dayRecs.reduce((s, r) => s + (parseInt(r.qty200) || 0), 0);
    const osSum300 = dayRecs.reduce((s, r) => s + (parseInt(r.qty300) || 0), 0);
    const otherGrouped = {};
    dayRecs.forEach(r => {
        const targets = r.target.split(', ');
        const results = r.result.split(', ');
        targets.forEach((tgt, idx) => {
            const tgtTrim = tgt.trim();
            const res = (results[idx] || '').trim();
            if (!tgtTrim.toLowerCase().startsWith('ос') && (res === 'знищено' || res === 'пошкоджено')) {
                const _tP=tgtTrim.split(' '),_tL=_tP[_tP.length-1];
                const abbrDisp=/^\d+$/.test(_tL)?_tP.slice(0,-1).join(' '):tgtTrim;
                const _sce=Object.entries(state.scoreTable).find(([a,sc])=>a.toLowerCase()===abbrDisp.toLowerCase()||(sc.fullName&&sc.fullName.toLowerCase()===abbrDisp.toLowerCase()));
                const dispName=_sce?_sce[0]:abbrDisp;
                const key=dispName.toUpperCase()+' '+res;
                if(!otherGrouped[key])otherGrouped[key]={d:dispName,r:res,n:0};
                otherGrouped[key].n++;
            }
        });
    });
    const resultLines = [];
    if (hasOs && osSum200 > 0) resultLines.push('ОС 200 - ' + osSum200 + '.');
    if (hasOs && osSum300 > 0) resultLines.push('ОС 300 - ' + osSum300 + '.');
    Object.entries(otherGrouped).forEach(([k, v]) => resultLines.push(v.d + ' ' + v.r + ' - ' + v.n + '.'));
    resultLines.forEach((l, i) => lines.push((i + 1) + '. ' + l));
    lines.push('Продовжують працювати.');
    lines.push('');
    lines.push('🫡🤝🇺🇦');
    return lines;
}

    const _fRecs=[...state.allArchiveRecs,...state.records].filter(r=>{const d=getDateOnly(r.datetime);return d&&_toYMD(d)>=_fFrom&&_toYMD(d)<=_fTo;});
    if(!_fRecs.length){showAlert('Вильотів за цей період не знайдено');return;}
    const _fPts=Math.round(_fRecs.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
    const _fLabelFrom=state.filterFrom.split('-').reverse().join('.');
    const _fLabelTo=state.filterTo.split('-').reverse().join('.');
    const _fLabel=_fLabelFrom+' — '+_fLabelTo+'р.';
    const _fLines=generateArchiveReport(_fRecs,_fLabel);
    _fLines.push('Загалом уражено, орієнтовно на '+_fPts+' балів.');
    _pushCostLines(_fLines,_fPts,_fRecs);
    const _fDrnCnt={};_fRecs.forEach(r=>{if(r.drone)_fDrnCnt[r.drone]=(_fDrnCnt[r.drone]||0)+1;});
    const _fAmmoCnt={};_fRecs.forEach(r=>{if(r.ammo)_fAmmoCnt[r.ammo]=(_fAmmoCnt[r.ammo]||0)+1;});
    const _fPvrCnt=state.pvr.map(pvr=>{const tot=Object.entries(pvr.map).reduce((s,[am,cf])=>s+(_fAmmoCnt[am]||0)*cf,0);return tot?pvr.name+': '+tot+' кг':''}).filter(Boolean);
    if(Object.keys(_fDrnCnt).length){_fLines.push('');_fLines.push('ДРОНИ:');Object.entries(_fDrnCnt).sort((a,b)=>b[1]-a[1]).forEach(([d,c])=>_fLines.push(d+' — '+c+' шт'));}
    if(Object.keys(_fAmmoCnt).length){_fLines.push('');_fLines.push('БОЄПРИПАСИ:');Object.entries(_fAmmoCnt).sort((a,b)=>b[1]-a[1]).forEach(([a,c])=>_fLines.push(a+' — '+c+' шт'));}
    if(_fPvrCnt.length){_fLines.push('');_fLines.push('ПВР:');_fPvrCnt.forEach(l=>_fLines.push(l));}
    navigator.clipboard.writeText(_fLines.join('\n')).catch(()=>{});
    showAlert('✅ Скопіювано!');
}

const _MNAMES=['СІЧЕНЬ','ЛЮТИЙ','БЕРЕЗЕНЬ','КВІТЕНЬ','ТРАВЕНЬ','ЧЕРВЕНЬ','ЛИПЕНЬ','СЕРПЕНЬ','ВЕРЕСЕНЬ','ЖОВТЕНЬ','ЛИСТОПАД','ГРУДЕНЬ'];
let _pck={yr:2026,mo:0,dy:null,hr:0,mn:0,hasTime:false,key:null,hrOpen:false,mnOpen:false};
function _pckOpen(key,hasTime,cur){
    const now=new Date();
    _pck.key=key;_pck.hasTime=hasTime;_pck.hrOpen=false;_pck.mnOpen=false;
    if(cur){
        const[dt,tm]=(cur||'').split('T');
        const pts=dt.split('-');
        _pck.yr=parseInt(pts[0])||now.getFullYear();
        _pck.mo=(parseInt(pts[1])||1)-1;
        _pck.dy=parseInt(pts[2])||null;
        if(tm){const tp=tm.split(':');_pck.hr=parseInt(tp[0])||0;_pck.mn=parseInt(tp[1])||0;}
        else{_pck.hr=hasTime?now.getHours():0;_pck.mn=hasTime?now.getMinutes():0;}
    } else {
        _pck.yr=now.getFullYear();_pck.mo=now.getMonth();_pck.dy=null;
        _pck.hr=hasTime?now.getHours():0;_pck.mn=hasTime?now.getMinutes():0;
    }
    _pckRender();
}
function _pckRender(){
    const p=_pck;
    const fd=(d=>(d===0?6:d-1))(new Date(p.yr,p.mo,1).getDay());
    const dim=new Date(p.yr,p.mo+1,0).getDate();
    const HDR=['ПН','ВТ','СР','ЧТ','ПТ','СБ','НД'];
    let cells=HDR.map(h=>`<div style="text-align:center;color:var(--khaki);font-size:0.72em;padding:3px 1px;font-family:inherit;letter-spacing:0.05em">${h}</div>`).join('');
    for(let i=0;i<fd;i++)cells+='<div></div>';
    for(let d=1;d<=dim;d++){
        const sel=p.dy===d;
        cells+=`<button onclick="_pckDay(${d})" style="padding:7px 2px;font-size:0.88em;border-radius:4px;border:none;cursor:pointer;font-family:inherit;letter-spacing:0.05em;background:${sel?'var(--yellow)':'var(--surface-light)'};color:${sel?'#1a1a12':'var(--text)'};transition:background 0.1s" onmousedown="this.style.opacity='0.7'" onmouseup="this.style.opacity='1'" ontouchstart="this.style.opacity='0.7'" ontouchend="this.style.opacity='1'">${d}</button>`;
    }
    const _hrs=Array.from({length:24},(_,i)=>i);
    const _mns=Array.from({length:60},(_,i)=>i);
    const _hList=_hrs.map(h=>`<div onclick="_pck.hr=${h};_pck.hrOpen=false;_pckRender()" ${h===p.hr?'data-sel':''} style="padding:9px 0;cursor:pointer;text-align:center;background:${h===p.hr?'var(--yellow)':'transparent'};color:${h===p.hr?'#1a1a12':'var(--text)'};font-family:inherit;font-size:0.9em;letter-spacing:0.05em;border-radius:3px">${String(h).padStart(2,'0')}</div>`).join('');
    const _mList=_mns.map(m=>`<div onclick="_pck.mn=${m};_pck.mnOpen=false;_pckRender()" ${m===p.mn?'data-sel':''} style="padding:9px 0;cursor:pointer;text-align:center;background:${m===p.mn?'var(--yellow)':'transparent'};color:${m===p.mn?'#1a1a12':'var(--text)'};font-family:inherit;font-size:0.9em;letter-spacing:0.05em;border-radius:3px">${String(m).padStart(2,'0')}</div>`).join('');
    const _hBrd=p.hrOpen?'var(--yellow)':'var(--surface-light)';
    const _mBrd=p.mnOpen?'var(--yellow)':'var(--surface-light)';
    const _boxSt='width:38px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--surface-light);border-radius:4px;cursor:pointer;font-size:0.9em;color:var(--yellow);font-family:inherit;letter-spacing:0.05em;border:2px solid ';
    const _dropSt='position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:20;width:70px;max-height:190px;overflow-y:auto;background:var(--surface);border:1px solid var(--yellow);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.5)';
    const _lblSt='position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--khaki);font-size:0.72em;letter-spacing:0.08em;font-family:inherit';
    const timeHtml=p.hasTime?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--surface-light)"><div style="display:flex;justify-content:center;align-items:center;gap:10px"><div style="position:relative;padding-top:18px"><div style="${_lblSt}">ГОД</div><div onclick="_pck.hrOpen=!_pck.hrOpen;_pck.mnOpen=false;_pckRender()" style="${_boxSt}${_hBrd}">${String(p.hr).padStart(2,'0')}</div>${p.hrOpen?`<div id="_pckHrList" style="${_dropSt}">${_hList}</div>`:''}</div><div style="color:var(--yellow);font-size:1.5em;font-weight:bold;line-height:1">:</div><div style="position:relative;padding-top:18px"><div style="${_lblSt}">ХВ</div><div onclick="_pck.mnOpen=!_pck.mnOpen;_pck.hrOpen=false;_pckRender()" style="${_boxSt}${_mBrd}">${String(p.mn).padStart(2,'0')}</div>${p.mnOpen?`<div id="_pckMnList" style="${_dropSt}">${_mList}</div>`:''}</div></div></div>`:'';
    const okDis=p.dy?'':'disabled';
    const okSt=p.dy?'':'opacity:0.38;pointer-events:none;';
    document.getElementById('modal').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box" style="max-width:330px;width:95%;padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button onclick="_pckNav(-1)" class="btn-stencil" style="padding:5px 14px;font-size:1em">◀</button><span class="stencil-shadow" style="color:var(--yellow);font-size:1.05em">${_MNAMES[p.mo]} ${p.yr}</span><button onclick="_pckNav(1)" class="btn-stencil" style="padding:5px 14px;font-size:1em">▶</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>${timeHtml}<div style="display:flex;gap:10px;margin-top:14px"><button onclick="closeModal()" onmousedown="this.style.background='#9a9070'" onmouseup="this.style.background=''" ontouchstart="this.style.background='#9a9070'" ontouchend="this.style.background=''" class="btn-stencil" style="flex:1">СКАСУВАТИ</button><button onclick="_pckConfirm()" onmousedown="this.style.background='#b8a020'" onmouseup="this.style.background=''" ontouchstart="this.style.background='#b8a020'" ontouchend="this.style.background=''" class="btn-stencil btn-yellow-dim" style="flex:1;${okSt}" ${okDis}>ВСТАНОВИТИ</button></div></div></div>`;
    if(p.hasTime){
        const _hc=document.getElementById('_pckHrList');
        const _mc=document.getElementById('_pckMnList');
        if(_hc){const _s=_hc.querySelector('[data-sel]');if(_s)_hc.scrollTop=_s.offsetTop-_hc.clientHeight/2+_s.clientHeight/2;}
        if(_mc){const _s=_mc.querySelector('[data-sel]');if(_s)_mc.scrollTop=_s.offsetTop-_mc.clientHeight/2+_s.clientHeight/2;}
    }
}
function _pckNav(dir){_pck.mo+=dir;if(_pck.mo<0){_pck.mo=11;_pck.yr--;}if(_pck.mo>11){_pck.mo=0;_pck.yr++;}  _pckRender();}
function _pckDay(d){_pck.dy=d;_pckRender();}
function _pckConfirm(){
    if(!_pck.dy)return;
    const y=String(_pck.yr),m=String(_pck.mo+1).padStart(2,'0'),d=String(_pck.dy).padStart(2,'0');
    state[_pck.key]=_pck.hasTime?`${y}-${m}-${d}T${String(_pck.hr).padStart(2,'0')}:${String(_pck.mn).padStart(2,'0')}`:`${y}-${m}-${d}`;
    state.zvityFilterShown=false;state.filterPeriodShown=false;
    closeModal();render();
}
