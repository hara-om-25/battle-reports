    <script>

});
window.addEventListener('unhandledrejection', function(e) {
    alert('PROMISE ПОМИЛКА:\n' + (e.reason && e.reason.message || e.reason) + '\n\nСтек:\n' + (e.reason && e.reason.stack ? e.reason.stack.substring(0,500) : 'нема'));
});
</script>
    <script>
const SHIELD_SVG = `<svg class="shield-svg" width="40" height="50" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><path d="M 5,5 L 95,5 L 95,80 Q 95,115 50,135 Q 5,115 5,80 Z" fill="#0057b7" stroke="#ffd700" stroke-width="3"/><g fill="#ffd700"><polygon points="48,20 52,20 53,75 50,90 47,75"/><polygon points="20,35 28,35 30,75 38,90 38,100 28,100 28,92 20,80"/><polygon points="80,35 72,35 70,75 62,90 62,100 72,100 72,92 80,80"/><polygon points="32,30 40,40 40,85 32,75"/><polygon points="68,30 60,40 60,85 68,75"/><rect x="28" y="70" width="44" height="6"/><rect x="44" y="90" width="12" height="20"/><rect x="40" y="105" width="20" height="5"/><polygon points="46,110 54,110 52,118 48,118"/></g></svg>`;


const CLIENT_ID = '1095528804215-gjcnuo3oc12osqm596dpda81slodrmvs.apps.googleusercontent.com';
const SHEET_ID = '16C9nHIQx_39ZqXbLHuqlmVYxrpHyf0XEDJW8HLnJMzs';

let state = {
    page: 'login', user: null, token: null, loaded: false,
    scoreTable: {}, drones: [], ammo: [], results: [], records: [],
    report: 1, counts: {},
    form: {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:''},
    selReport: null, selDate: null,
    inputVal: '', inputList: null, inputIdx: null, editVal: ''
};

let tokenClient = null;

window.onload = () => {
    const initInterval = setInterval(() => {
        if (typeof google !== 'undefined' && google.accounts) {
            clearInterval(initInterval);
            initAuth();
            const savedToken = sessionStorage.getItem('token');
            const savedEmail = sessionStorage.getItem('email');
            if (savedToken && savedEmail) {
                state.token = savedToken;
                state.user = savedEmail;
                verifyAndLoad();
            } else {
                render();
            }
        }
    }, 100);
};

async function verifyAndLoad() {
    try {
        const usersResp = await fetch(
            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent('@')}!A:A`,
            { headers: { 'Authorization': `Bearer ${state.token}` } }
        ).then(r => r.json());
        
        if (usersResp.error) {
            alert('Помилка доступу до файла: ' + usersResp.error.message);
            logout(); return;
        }
        
        const users = (usersResp.values || []).flat().map(x => (x||'').trim().toLowerCase()).filter(x => x);
        const userEmail = (state.user || '').trim().toLowerCase();
        if (!users.includes(userEmail)) {
            alert('У вас немає доступу!\nВаш email: ' + state.user);
            logout(); return;
        }
        
        await loadDataFromAPI();
    } catch(err) {
        alert('Помилка перевірки: ' + err.message);
        logout();
    }
}

function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',
        callback: async (response) => {
            if (response.error) {
                alert('Помилка авторизації: ' + response.error);
                return;
            }
            state.token = response.access_token;
            try {
                const userInfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                }).then(r => r.json());
                state.user = userInfo.email;
                
                sessionStorage.setItem('token', state.token);
                sessionStorage.setItem('email', state.user);
                await verifyAndLoad();
            } catch(err) {
                alert('Помилка: ' + err.message);
                logout();
            }
        }
    });
}

function login() { tokenClient.requestAccessToken(); }

function logout() {
    sessionStorage.removeItem('token');
    sessionStorage.removeItem('email');
    state.token = null; state.user = null;
    state.scoreTable = {}; state.drones = []; state.ammo = []; state.results = [];  state.records = [];
    state.loaded = false; state.page = 'login';
    render();
}

async function apiGet(range) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`,
        { headers: { 'Authorization': `Bearer ${state.token}` } }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp.values || [];
}

async function apiAppend(range, values) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED`,
        {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: values })
        }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

async function apiUpdate(range, values) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`,
        {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: values })
        }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

async function apiClear(range) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:clear`,
        { method: 'POST', headers: { 'Authorization': `Bearer ${state.token}` } }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

function getDateOnly(datetime) {
    if (!datetime) return '';
    return datetime.split(' ')[0].replace(',', '').trim();
}

async function loadDataFromAPI() {
    try {
        state.page = 'loading'; render();
        
        // "е бали": A=абревіатура, B=коеф. за знищено, C=коеф. за пошкоджено
        const scoreRows = await apiGet('е бали');
        state.scoreTable = {};
        for (let i = 1; i < scoreRows.length; i++) {
            if (scoreRows[i] && scoreRows[i][0]) {
                state.scoreTable[scoreRows[i][0]] = {
                    znyshcheno: parseFloat(scoreRows[i][1]) || 0,
                    poshkodzheno: parseFloat(scoreRows[i][2]) || 0
                };
            }
        }
        
        const listRows = await apiGet('СПИСКИ');
        state.drones = []; state.ammo = []; state.results = [];
        for (let i = 1; i < listRows.length; i++) {
            const row = listRows[i] || [];
            if (row[0]) state.drones.push(row[0]);
            if (row[1]) state.ammo.push(row[1]);
            if (row[2]) state.results.push(row[2]);
        }
        
        const mainRows = await apiGet('ГОЛОВНА');
        state.records = [];
        for (let i = 1; i < mainRows.length; i++) {
            const row = mainRows[i] || [];
            if (row[0] || row[2]) {
                state.records.push({
                    reportNum: parseInt(row[0]) || 0,
                    datetime: row[1] || '',
                    target: row[2] || '',
                    qty200: parseInt(row[3]) || 0,
                    qty300: parseInt(row[4]) || 0,
                    coordinates: row[5] || '',
                    drone: row[6] || '',
                    ammo: row[7] || '',
                    result: row[8] || '',
                    points: parseFloat(row[9]) || 0
                });
            }
        }
        
        if (state.records.length > 0) {
            state.report = Math.max(...state.records.map(r => r.reportNum));
            const reportRecs = state.records.filter(r => r.reportNum === state.report);
            state.counts = {};
            reportRecs.forEach(r => {
                const abbr = r.target.split(' ').slice(0, -1).join(' ');
                state.counts[abbr] = (state.counts[abbr] || 0) + 1;
            });
        } else {
            state.report = 1; state.counts = {};
        }
        
        state.loaded = true; state.page = 'form';
        render();
    } catch(err) {
        console.error('Завантаження failed:', err);
        alert('Помилка завантаження: ' + err.message + '\n\nДеталі в консолі (F12)');
        logout();
    }
}

async function syncListsToAPI() {
    try {
        await apiClear('СПИСКИ!A2:C');
        const maxLen = Math.max(state.drones.length, state.ammo.length, state.results.length);
        if (maxLen === 0) return;
        const rows = [];
        for (let i = 0; i < maxLen; i++) {
            rows.push([state.drones[i] || '', state.ammo[i] || '', state.results[i] || '']);
        }
        await apiUpdate(`СПИСКИ!A2:C${maxLen + 1}`, rows);
    } catch(err) {
        alert('Помилка синхронізації списків: ' + err.message);
    }
}

function cleanCoords(coord) { if(!coord) return ''; return coord.split(',')[0].split(' ').slice(0,4).join(' ').trim(); }

function esc(s) { if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Нова формула:
// База завжди: q200 × ОС.B + q300 × ОС.C
// Якщо ціль = ОС → тільки база
// Якщо ціль ≠ ОС:
//   - результат не обраний → ціль.C + база
//   - результат "знищено" → ціль.B + база
//   - результат "пошкоджено" → ціль.C + база
//   - інший результат → 0 + база
function calculatePoints(abbr, q200, q300, result) {
    const os = state.scoreTable['ОС'] || {znyshcheno:0, poshkodzheno:0};
    const base = parseInt(q200) * os.znyshcheno + parseInt(q300) * os.poshkodzheno;
    if (!abbr) return base;
    if (abbr === 'ОС') return base;
    const target = state.scoreTable[abbr];
    if (!target) return base;
    let mainPoints = 0;
    if (!result) {
        mainPoints = target.poshkodzheno; // мінімальне = пошкоджено
    } else if (result === 'знищено') {
        mainPoints = target.znyshcheno;
    } else if (result === 'пошкоджено') {
        mainPoints = target.poshkodzheno;
    } else {
        mainPoints = 0;
    }
    return mainPoints + base;
}

function addTargetToForm() {
    if(!state.form.newTarget || !state.form.newResult) {
        alert('Виберіть ціль і результат!');
        return;
    }
    const abbr = state.form.newTarget;
    if(!state.counts[abbr]) state.counts[abbr]=0;
    state.counts[abbr]++;
    const fullName = abbr + ' ' + state.counts[abbr];
    state.form.targets.push({abbr, fullName, result: state.form.newResult});
    state.form.newTarget = '';
    state.form.newResult = '';
    render();
}

function removeTargetFromForm(idx) {
    const t = state.form.targets[idx];
    if(t && state.counts[t.abbr]) state.counts[t.abbr]--;
    state.form.targets.splice(idx, 1);
    render();
}

async function add() {
    if(state.form.targets.length === 0 || !state.form.drone || !state.form.ammo) {
        alert('Додайте хоча б одну ціль, виберіть дрон та боєприпас!');
        return;
    }
    
    let totalPoints = 0;
    let targetStr = '';
    let resultStr = '';
    for(let i=0; i<state.form.targets.length; i++) {
        const t = state.form.targets[i];
        const pts = calculatePoints(t.abbr, state.form.q200, state.form.q300, t.result);
        totalPoints += pts;
        targetStr += (i>0?', ':'') + t.fullName;
        resultStr += (i>0?', ':'') + t.result;
    }
    
    const cleanedCoord = cleanCoords(state.form.coord);
    const rec = {
        reportNum: state.report,
        datetime: new Date().toLocaleString('uk-UA'),
        target: targetStr,
        qty200: state.form.q200,
        qty300: state.form.q300,
        coordinates: cleanedCoord,
        drone: state.form.drone,
        ammo: state.form.ammo,
        result: resultStr,
        points: totalPoints
    };
    state.records.push(rec);
    state.form = {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:''};
    
    try {
        await apiAppend('ГОЛОВНА!A:J', [[
            rec.reportNum, rec.datetime, rec.target,
            rec.qty200, rec.qty300,
            rec.coordinates, rec.drone, rec.ammo, rec.result,
            rec.points
        ]]);
        alert('✅ Запис додано і синхронізовано!');
    } catch(err) {
        alert('⚠️ Запис додано локально, але не синхронізовано: ' + err.message);
    }
    render();
}

function newReport() {
    state.report++;
    state.counts = {};
    render();
}

function selectItem(list, idx) { state.inputVal = state[list][idx]; state.inputList = list; state.inputIdx = idx; render(); }
function clearInput() { state.inputVal = ''; state.inputList = null; state.inputIdx = null; render(); }

function showModal() {
    const modal = document.getElementById('modal');
    modal.innerHTML = `<div class="modal-overlay"><div class="modal-box"><h2 class="stencil-shadow text-xl mb-4" style="color: var(--yellow)">В ЯКИЙ СПИСОК ДОДАТИ?</h2><div class="space-y-2"><button onclick="addToList('drones');closeModal()" class="btn-stencil btn-blue w-full">ДРОНИ</button><button onclick="addToList('ammo');closeModal()" class="btn-stencil btn-blue w-full">БОЄПРИПАС</button><button onclick="addToList('results');closeModal()" class="btn-stencil btn-blue w-full">РЕЗУЛЬТАТИ</button><button onclick="closeModal()" class="btn-stencil w-full">СКАСУВАТИ</button></div></div></div>`;
}

function showEditModal() {
    const modal = document.getElementById('modal');
    state.editVal = state.inputVal;
    modal.innerHTML = `<div class="modal-overlay"><div class="modal-box"><h2 class="stencil-shadow text-xl mb-4" style="color: var(--yellow)">РЕДАГУВАННЯ</h2><div class="mb-4"><input type="text" id="editInput" value="${esc(state.editVal)}" class="field" /></div><div class="space-y-2"><button onclick="saveEdit()" class="btn-stencil btn-green w-full">ЗБЕРЕГТИ</button><button onclick="closeModal()" class="btn-stencil w-full">СКАСУВАТИ</button></div></div></div>`;
    setTimeout(() => { document.getElementById('editInput').focus(); }, 100);
}

function showDeleteModal() {
    const modal = document.getElementById('modal');
    modal.innerHTML = `<div class="modal-overlay"><div class="modal-box"><h2 class="stencil-shadow text-xl mb-4" style="color: var(--yellow)">ВИДАЛЕННЯ</h2><div class="mb-4 p-3 rounded" style="background: rgba(0,0,0,0.4); border: 1px dashed var(--khaki)"><p class="text-center stencil">${esc(state.inputVal)}</p></div><div class="space-y-2"><button onclick="confirmDelete()" class="btn-stencil btn-danger w-full">ВИДАЛИТИ</button><button onclick="closeModal()" class="btn-stencil w-full">СКАСУВАТИ</button></div></div></div>`;
}

async function saveEdit() {
    const val = document.getElementById('editInput').value;
    if(val.trim() && state.inputList !== null && state.inputIdx !== null) {
        state[state.inputList][state.inputIdx] = val.trim();
        state.inputVal = val.trim();
        await syncListsToAPI();
        closeModal(); render();
    }
}

async function confirmDelete() {
    if(state.inputList !== null && state.inputIdx !== null) {
        state[state.inputList].splice(state.inputIdx, 1);
        await syncListsToAPI();
        clearInput(); closeModal(); render();
    }
}

function closeModal() { document.getElementById('modal').innerHTML = ''; }

async function addToList(list) {
    if(state.inputVal.trim()) {
        if(!state[list].includes(state.inputVal.trim())) {
            state[list].push(state.inputVal.trim());
            await syncListsToAPI();
        }
        clearInput(); render();
    }
}

function addItem() { showModal(); }
function editItem() { if(state.inputList !== null && state.inputIdx !== null) { showEditModal(); } }
function deleteItem() { if(state.inputList !== null && state.inputIdx !== null) { showDeleteModal(); } }

function generateReport(dayRecs) {
    let lines = [];
    lines.push('Доповідаю!');
    const date = getDateOnly(dayRecs[0].datetime);
    lines.push(date+'р. ТГ Мур 5/7 здійснено '+dayRecs.length+' бойових вильотів.');
    const total = dayRecs.reduce((s,r)=>s+r.points,0);
    lines.push('Вражено, орієнтовно на '+total+' балів, а саме:');
    lines.push('');
    const grouped = {};
    dayRecs.forEach(r => { const key=r.target+' '+r.result; grouped[key]=(grouped[key]||0)+1; });
    let i=1;
    Object.entries(grouped).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => { lines.push(i+'. '+k+' - '+v+' шт.'); i++; });
    lines.push('');
    lines.push('🫡🤝🇺🇦');
    return lines;
}

function exportXLSX() {
    if(!state.selReport || !state.selDate) { alert('Виберіть звіт та день!'); return; }
    const dayRecs = state.records.filter(r=>r.reportNum===state.selReport && getDateOnly(r.datetime)===state.selDate);
    if(dayRecs.length===0) { alert('Немає записів!'); return; }
    try {
        const data = [['Звіт','Дата та час','Ціль','200','300','Координати','Тип дрона','Боєприпас','Результат','Балів']];
        dayRecs.forEach(r => { data.push([r.reportNum,r.datetime,r.target,r.qty200,r.qty300,r.coordinates,r.drone,r.ammo,r.result,r.points]); });
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Звіти');
        XLSX.writeFile(wb, 'battle-reports.xlsx');
        alert('✅ XLSX експортовано!');
    } catch(e) { alert('Помилка: ' + e.message); }
}

function exportPDF() {
    if(!state.selReport || !state.selDate) { alert('Виберіть звіт та день!'); return; }
    const dayRecs = state.records.filter(r=>r.reportNum===state.selReport && getDateOnly(r.datetime)===state.selDate);
    if(dayRecs.length===0) { alert('Немає записів!'); return; }
    const lines = generateReport(dayRecs);
    const printContent = `<html><head><meta charset="UTF-8"><title>Звіт</title><style>body{font-family:Arial;line-height:1.6;padding:20px;}pre{white-space:pre-wrap;}</style></head><body><pre>${lines.join('\n')}</pre></body></html>`;
    const printWindow = window.open('','','height=400,width=600');
    printWindow.document.write(printContent);
    printWindow.document.close();
    setTimeout(() => printWindow.print(), 250);
}

function copyReport() {
    if(!state.selReport || !state.selDate) { alert('Виберіть звіт та день!'); return; }
    const dayRecs = state.records.filter(r=>r.reportNum===state.selReport && getDateOnly(r.datetime)===state.selDate);
    if(dayRecs.length===0) { alert('Немає записів!'); return; }
    const lines = generateReport(dayRecs);
    navigator.clipboard.writeText(lines.join('\n'));
    alert('✅ Скопійовано!');
}

function getAbbr() { const p = state.form.target.split(' '); return p.length>1?p.slice(0,-1).join(' '):''; }

function renderListSection(list, title) {
    return `<div class="crate p-4"><h2 class="stencil-shadow text-lg mb-3" style="color: var(--yellow)">${title} <span style="color: var(--khaki)">(${state[list].length})</span></h2><div class="space-y-2">${state[list].map((x,i)=>`<div class="list-item" onclick="selectItem('${list}',${i})">${esc(x)}</div>`).join('')}</div></div>`;
}
