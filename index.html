    <script>
window.addEventListener('error', function(e) {
    showAlert('JS ПОМИЛКА:\n' + e.message + '\n\nФайл: ' + (e.filename||'?') + '\nРядок: ' + (e.lineno||'?') + '\nСтек:\n' + (e.error && e.error.stack ? e.error.stack.substring(0,500) : 'нема'));
});
window.addEventListener('unhandledrejection', function(e) {
    showAlert('PROMISE ПОМИЛКА:\n' + (e.reason && e.reason.message || e.reason) + '\n\nСтек:\n' + (e.reason && e.reason.stack ? e.reason.stack.substring(0,500) : 'нема'));
});
</script>
    <script>
const SHIELD_SVG = `<svg class="shield-svg" width="40" height="50" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle"><path d="M 5,5 L 95,5 L 95,80 Q 95,115 50,135 Q 5,115 5,80 Z" fill="#0057b7" stroke="#ffd700" stroke-width="3"/><g fill="#ffd700"><polygon points="48,20 52,20 53,75 50,90 47,75"/><polygon points="20,35 28,35 30,75 38,90 38,100 28,100 28,92 20,80"/><polygon points="80,35 72,35 70,75 62,90 62,100 72,100 72,92 80,80"/><polygon points="32,30 40,40 40,85 32,75"/><polygon points="68,30 60,40 60,85 68,75"/><rect x="28" y="70" width="44" height="6"/><rect x="44" y="90" width="12" height="20"/><rect x="40" y="105" width="20" height="5"/><polygon points="46,110 54,110 52,118 48,118"/></g></svg>`;


const CLIENT_ID = '1095528804215-gjcnuo3oc12osqm596dpda81slodrmvs.apps.googleusercontent.com';
let SHEET_ID = localStorage.getItem('sheetId') || '16C9nHIQx_39ZqXbLHuqlmVYxrpHyf0XEDJW8HLnJMzs';

let state = {
    page: 'login', user: null, token: null, loaded: false,
    scoreTable: {}, drones: [], ammo: [], results: [], records: [],
    report: 1, counts: {},
    form: {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:'', selTargetName:''},
    selReport: null, selDate: null, selVylotyDate: null, archiveSheets: [], selArchive: null, archiveRecs: [], archiveLoading: false, pvr: [], allArchiveRecs: [], allArchiveLoaded: false, allArchiveLoading: false,
    inputVal: '', inputList: null, inputIdx: null, editVal: '', filterFrom: '', filterTo: '', filterPeriodOpen: false, filterPeriodShown: false, zvityFilterFrom: '', zvityFilterTo: '', zvityFilterOpen: false, zvityFilterShown: false
};

let tokenClient = null;

window.onload = () => {
    const initInterval = setInterval(() => {
        if (typeof google !== 'undefined' && google.accounts) {
            clearInterval(initInterval);
            initAuth();
            const savedToken = localStorage.getItem('token');
            const savedEmail = localStorage.getItem('email');
            if (savedToken && savedEmail) {
                state.token = savedToken;
                state.user = savedEmail;
                verifyAndLoad();
            } else {
                render();
            }
        }
    }, 100);
};

async function verifyAndLoad() {
    try {
        const usersResp = await fetch(
            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent('@')}!A:A`,
            { headers: { 'Authorization': `Bearer ${state.token}` } }
        ).then(r => r.json());
        
        if (usersResp.error) {
            if (usersResp.error.code === 401 || usersResp.error.status === 'UNAUTHENTICATED') {
                state.token = null; state.loaded = false;
                tokenClient.requestAccessToken({ prompt: '', hint: state.user||'' });
                return;
            }
            showAlert('Помилка доступу до файла: ' + usersResp.error.message);
            logout(); return;
        }
        
        const users = (usersResp.values || []).flat().map(x => (x||'').trim().toLowerCase()).filter(x => x);
        const userEmail = (state.user || '').trim().toLowerCase();
        if (!users.includes(userEmail)) {
            showAlert('У вас немає доступу!\nВаш email: ' + state.user);
            logout(); return;
        }
        
        await loadDataFromAPI();
    } catch(err) {
        showAlert('Помилка перевірки: ' + err.message);
        logout();
    }
}

function _startTokenTimer() {
    if(window._tokenTimer)clearInterval(window._tokenTimer);
    window._tokenTimer=setInterval(()=>{
        if(state.token&&state.user)tokenClient.requestAccessToken({prompt:'',hint:state.user});
    },45*60*1000);
    localStorage.setItem('_lastRefresh',Date.now().toString());
}
document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&state.token&&state.user){
        const _last=parseInt(localStorage.getItem('_lastRefresh')||'0');
        if(Date.now()-_last>44*60*1000)tokenClient.requestAccessToken({prompt:'',hint:state.user});
    }
});
function initAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',
        callback: async (response) => {
            if (response.error) {
                showAlert('Помилка авторизації: ' + response.error);
                return;
            }
            state.token = response.access_token;
            localStorage.setItem('token', state.token);
            if (state.user && state.loaded) {
                _startTokenTimer(); return;
            }
            try {
                if (!state.user) {
                    const userInfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { 'Authorization': `Bearer ${state.token}` }
                    }).then(r => r.json());
                    state.user = userInfo.email;
                    localStorage.setItem('email', state.user);
                }
                _startTokenTimer();
                await verifyAndLoad();
            } catch(err) {
                showAlert('Помилка: ' + err.message);
                logout();
            }
        }
    });
}

function showAlert(msg) {
    var _ov = document.createElement('div');
    _ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    var _bx = document.createElement('div');
    _bx.style.cssText = 'background:var(--surface);border:1px solid var(--olive-dark);box-shadow:4px 4px 0 var(--olive-dark);padding:24px 28px 20px;max-width:420px;width:100%;font-family:Tektur,monospace;color:var(--text)';
    var _ti = document.createElement('div');
    _ti.style.cssText = 'color:var(--yellow);font-size:0.7em;letter-spacing:0.15em;margin-bottom:14px;font-weight:700';
    _ti.textContent = 'ПОВІДОМЛЕННЯ';
    var _mg = document.createElement('div');
    _mg.style.cssText = 'white-space:pre-wrap;font-size:0.92em;margin-bottom:22px;line-height:1.5';
    _mg.textContent = msg;
    var _ok = document.createElement('button');
    _ok.className = 'btn-stencil';
    _ok.style.cssText = 'float:right;padding:4px 22px;font-size:0.85em';
    _ok.textContent = 'OK';
    _bx.appendChild(_ti); _bx.appendChild(_mg); _bx.appendChild(_ok);
    _ov.appendChild(_bx);
    document.body.appendChild(_ov);
    _ok.addEventListener('click', function() { document.body.removeChild(_ov); });
    _ok.addEventListener('mousedown', function() { this.style.background='#5ab558'; });
    _ok.addEventListener('mouseup', function() { this.style.background=''; });
    _ok.addEventListener('touchstart', function() { this.style.background='#5ab558'; }, {passive:true});
    _ok.addEventListener('touchend', function() { this.style.background=''; });
}
function login() { const _h=localStorage.getItem('email')||''; tokenClient.requestAccessToken(_h?{hint:_h}:{}); }
function parseSheetId(v) {
    v=(v||'').trim();
    const m=v.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(v)?v:'');
}
function applySheetAndLogin() {
    const el=document.getElementById('_sheetUrlInp');
    const raw=el?el.value.trim():'';
    if(raw){
        const id=parseSheetId(raw);
        if(!id){showAlert('Невірне посилання на Google Таблицю!');return;}
        SHEET_ID=id;
        localStorage.setItem('sheetId',id);
    }
    login();
}
function showSheetSettings() {
    document.getElementById('modal').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box"><h2 class="stencil-shadow text-xl mb-4" style="color:var(--yellow)">GOOGLE ТАБЛИЦЯ</h2><p class="stencil mb-2" style="color:var(--khaki);font-size:0.85em">Посилання або ID таблиці:</p><input id="_sheetModalInp" class="field mb-4" style="font-size:0.8em" value="${esc(SHEET_ID)}" placeholder="https://docs.google.com/spreadsheets/d/..."/><div class="space-y-2"><button onclick="_saveSheetModal()" class="btn-stencil btn-green w-full">ЗБЕРЕГТИ</button><button onclick="closeModal()" class="btn-stencil w-full">СКАСУВАТИ</button></div></div></div>`;
}
function _saveSheetModal() {
    const el=document.getElementById('_sheetModalInp');
    const raw=el?el.value.trim():'';
    const id=parseSheetId(raw)||raw;
    if(!id){showAlert('Введіть посилання!');return;}
    SHEET_ID=id;
    localStorage.setItem('sheetId',id);
    closeModal();
    showAlert('✅ Таблицю збережено!\nНатисніть ↻ для перезавантаження даних');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('email');
    if(window._tokenTimer){clearInterval(window._tokenTimer);window._tokenTimer=null;}
    state.token = null; state.user = null;
    state.scoreTable = {}; state.drones = []; state.ammo = []; state.results = [];  state.records = [];
    state.archiveSheets = []; state.selArchive = null; state.archiveRecs = []; state.archiveLoading = false; state.pvr = [];
    state.allArchiveRecs = []; state.allArchiveLoaded = false; state.allArchiveLoading = false;
    state.loaded = false; state.page = 'login';
    render();
    setTimeout(()=>window.close(),100);
}

async function apiGet(range) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`,
        { headers: { 'Authorization': `Bearer ${state.token}` } }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp.values || [];
}

async function apiAppend(range, values) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED`,
        {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: values })
        }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

async function apiUpdate(range, values) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`,
        {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: values })
        }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

async function apiClear(range) {
    const resp = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:clear`,
        { method: 'POST', headers: { 'Authorization': `Bearer ${state.token}` } }
    ).then(r => r.json());
    if (resp.error) throw new Error(resp.error.message);
    return resp;
}

function getDateOnly(datetime) {
    if (!datetime) return '';
    return datetime.split(' ')[0].replace(',', '').trim();
}

async function syncOnShieldClick() {
    state.shieldHide = true;
    render();
    try {
        await syncRecordsToAPI();
        showAlert('✅ Дані синхронізовано з ГОЛОВНА!');
    } catch(e) {
        showAlert('⚠️ Помилка синхронізації: ' + e.message);

function generateArchiveReport(recs, periodLabel) {
    const reportTitle = state.reportTitle || 'ТГ невідомий';
    const hasOs = recs.some(r => r.target.split(', ').some(t => t.trim().toLowerCase().startsWith('ос')));
    const osSum200 = recs.reduce((s, r) => s + (parseInt(r.qty200) || 0), 0);
    const osSum300 = recs.reduce((s, r) => s + (parseInt(r.qty300) || 0), 0);
    const otherGrouped = {};
    recs.forEach(r => {
        const targets = r.target.split(', ');
        const results = r.result.split(', ');
        targets.forEach((tgt, idx) => {
            const tgtTrim = tgt.trim();
            const res = (results[idx] || '').trim();
            if (!tgtTrim.toLowerCase().startsWith('ос') && (res === 'знищено' || res === 'пошкоджено')) {
                const _tP=tgtTrim.split(' '),_tL=_tP[_tP.length-1];
                const abbrDisp=/^\d+$/.test(_tL)?_tP.slice(0,-1).join(' '):tgtTrim;
                const _sce=Object.entries(state.scoreTable).find(([a,sc])=>a.toLowerCase()===abbrDisp.toLowerCase()||(sc.fullName&&sc.fullName.toLowerCase()===abbrDisp.toLowerCase()));
                const dispName=_sce?_sce[1].fullName:abbrDisp;
                const key=dispName.toUpperCase()+' '+res;
                if(!otherGrouped[key])otherGrouped[key]={d:dispName,r:res,n:0};
                otherGrouped[key].n++;
            }
        });
    });
    const _allItems=[];
    const _osSce=Object.entries(state.scoreTable).find(([a])=>a.toLowerCase()==='ос');
    const _osN=(_osSce&&_osSce[1].fullName)?_osSce[1].fullName:'ОС';
    if (hasOs && osSum200 > 0) _allItems.push({t:_osN+' 200',n:osSum200});
    if (hasOs && osSum300 > 0) _allItems.push({t:_osN+' 300',n:osSum300});
    Object.entries(otherGrouped).forEach(([k,v])=>_allItems.push({t:v.d+' '+v.r,n:v.n}));
    _allItems.sort((a,b)=>b.n-a.n);
    const lines = [periodLabel + ' ТГ "' + reportTitle + '" здійснено ' + recs.length + ' вильотів, уражено:'];
    _allItems.forEach((p,i)=>lines.push((i+1)+'. '+p.t+' - '+p.n+(i===_allItems.length-1?' шт.':' шт;')));
    return lines;
}

                };

        for (let i = 1; i < listRows.length; i++) {

            if (row[1]) state.results.push(row[1].trim());

        }
        const _pvHdr=listRows[0]||[];state.pvr=[3,4,5,6].map(ci=>{const name=(_pvHdr[ci]||'').trim();if(!name)return null;const map={};for(let i=1;i<listRows.length;i++){const row=listRows[i]||[];const ammo=(row[2]||'').trim();const val=(row[ci]||'').toString().trim().replace(',','.');if(ammo&&val&&val!=='0'){const c=parseFloat(val);if(c)map[ammo]=c;}}return Object.keys(map).length?{name,map}:null;}).filter(Boolean);
        const mainRows = await apiGet('ГОЛОВНА');
        state.records = [];
        for (let i = 1; i < mainRows.length; i++) {
            const row = mainRows[i] || [];

                    reportNum: parseInt(row[0]) || 0,

                    qty300: parseInt(row[4]) || 0,

                    ammo: (row[7] || '').trim(),
                    result: row[8] || '',
                    points: parseFloat(row[9]) || 0
                });
            }
        }
        state.records.forEach(r=>{if((r.qty200||r.qty300)&&!r.target.split(', ').some(t=>{const _p=t.trim().split(' '),_l=_p[_p.length-1],_a=/^\d+$/.test(_l)?_p.slice(0,-1).join(' '):t.trim();return _a==='ОС';})){r.qty200=0;r.qty300=0;}});
        
        if (state.records.length > 0) {
            state.report = Math.max(...state.records.map(r => r.reportNum));
            const reportRecs = state.records.filter(r => r.reportNum === state.report);
            state.counts = {};
            reportRecs.forEach(r => {
                (r.target||'').split(', ').forEach(t => {
                    const _p=t.trim().split(' '),_l=_p[_p.length-1];
                    const _n=/^\d+$/.test(_l)?parseInt(_l):0;
                    const _a=/^\d+$/.test(_l)?_p.slice(0,-1).join(' '):t.trim();
                    if(!_a)return;
                    const _u=_a.toUpperCase();
                    const _k=Object.keys(state.scoreTable).find(k=>k.toUpperCase()===_u)||(()=>{const _lo=_a.toLowerCase();for(const[_ka,_d]of Object.entries(state.scoreTable))if(_d.fullName&&_d.fullName.toLowerCase()===_lo)return _ka;return _a;})();
                    if(_k)state.counts[_k]=Math.max(state.counts[_k]||0,_n);
                });

        } else {

function cleanCoords(coord) { if(!coord) return ''; return coord.split(',')[0].split(' ').slice(0,4).join(' ').trim(); }

function esc(s) { if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function calculatePoints(abbr, q200, q300, result) {
    if (abbr === 'ОС') {
        const os = state.scoreTable['ОС'] || {znyshcheno:0, poshkodzheno:0};
        if (result === 'знищено') return os.znyshcheno * (parseInt(q200)||0) + os.poshkodzheno * (parseInt(q300)||0);
        if (result === 'пошкоджено') return os.poshkodzheno * (parseInt(q300)||0);
        return 0;
    }
    const target = state.scoreTable[abbr];
    if (!target) return 0;
    if (result === 'знищено') return target.znyshcheno;
    if (result === 'пошкоджено') return target.poshkodzheno;
    return 0;
}

function _freqSortTargets(list) {
    const cnt = {};
    state.records.forEach(r => {
        if (!r.target) return;
        r.target.split(', ').forEach(t => {
            const p = t.trim().split(' ');
            const abbr = (/^\d+$/.test(p[p.length-1]) ? p.slice(0,-1).join(' ') : t.trim()).toUpperCase();
            if (abbr) cnt[abbr] = (cnt[abbr]||0)+1;
        });
    });
    return [...list].sort((a,b) => (cnt[b.toUpperCase()]||0)-(cnt[a.toUpperCase()]||0));
}
function _freqSort(list, field) {
    const cnt = {};
    state.records.forEach(r => { const v = r[field]; if (v) cnt[v] = (cnt[v]||0)+1; });

function _freqSortResults(list) {

    state.records.forEach(r => { if (r.result) r.result.split(', ').forEach(x => { x=x.trim(); if(x) cnt[x]=(cnt[x]||0)+1; }); });

}

async function add() {
    if(state.form.targets.length === 0) {
        showAlert('Додайте результат вильоту, навіть якщо ціль не було уражено');
        return;
    }
    if(!state.form.drone || !state.form.ammo) {
        showAlert('Виберіть дрон та боєприпас!');
        return;
    }
    
    let totalPoints = 0;
    let targetStr = '';
    let resultStr = '';
    for(let i=0; i<state.form.targets.length; i++) {
        const t = state.form.targets[i];
        const pts = calculatePoints(t.abbr, state.form.q200, state.form.q300, t.result);
        totalPoints += pts;
        targetStr += (i>0?', ':'') + t.fullName;
        resultStr += (i>0?', ':'') + t.result;

    const rec = {

        target: targetStr,
        qty200: state.form.q200,
        qty300: state.form.q300,
        coordinates: cleanedCoord,
        drone: state.form.drone,
        ammo: state.form.ammo,
        result: resultStr,
        points: totalPoints
    };
    state.records.push(rec);
    state.form = {targets:[], q200:0, q300:0, coord:'', drone:'', ammo:'', newTarget:'', newResult:''};
    
    try {
        await apiAppend('ГОЛОВНА!A:J', [[
            rec.reportNum, rec.datetime, rec.target,

            rec.coordinates, rec.drone, rec.ammo, rec.result,

function generateReport(dayRecs) {
    let lines = [];
    lines.push('Доповідаю!');
    lines.push('');
    const date = getDateOnly(dayRecs[0].datetime);
    const reportTitle = state.reportTitle || 'ТГ невідомий';
    const totalPoints = Math.round(dayRecs.reduce((s, r) => s + (parseFloat(r.points) || 0), 0));
    lines.push(date+'р.,Тг., "'+reportTitle+'" здійснено '+dayRecs.length+' вильотів, уражено.');
    const hasOs = dayRecs.some(r => r.target.split(', ').some(t => t.trim().toLowerCase().startsWith('ос')));
    const osSum200 = dayRecs.reduce((s, r) => s + (parseInt(r.qty200) || 0), 0);
    const osSum300 = dayRecs.reduce((s, r) => s + (parseInt(r.qty300) || 0), 0);
    const otherGrouped = {};
    dayRecs.forEach(r => {
        const targets = r.target.split(', ');
        const results = r.result.split(', ');
        targets.forEach((tgt, idx) => {
            const tgtTrim = tgt.trim();
            const res = (results[idx] || '').trim();
            if (!tgtTrim.toLowerCase().startsWith('ос') && (res === 'знищено' || res === 'пошкоджено')) {
                const _tP=tgtTrim.split(' '),_tL=_tP[_tP.length-1];
                const abbrDisp=/^\d+$/.test(_tL)?_tP.slice(0,-1).join(' '):tgtTrim;
                const _sce=Object.entries(state.scoreTable).find(([a,sc])=>a.toLowerCase()===abbrDisp.toLowerCase()||(sc.fullName&&sc.fullName.toLowerCase()===abbrDisp.toLowerCase()));
                const dispName=_sce?_sce[0]:abbrDisp;
                const key=dispName.toUpperCase()+' '+res;
                if(!otherGrouped[key])otherGrouped[key]={d:dispName,r:res,n:0};
                otherGrouped[key].n++;
            }
        });
    });
    const resultLines = [];
    if (hasOs && osSum200 > 0) resultLines.push('ОС 200 - ' + osSum200 + '.');
    if (hasOs && osSum300 > 0) resultLines.push('ОС 300 - ' + osSum300 + '.');
    Object.entries(otherGrouped).forEach(([k, v]) => resultLines.push(v.d + ' ' + v.r + ' - ' + v.n + '.'));
    resultLines.forEach((l, i) => lines.push((i + 1) + '. ' + l));
    lines.push('Продовжують працювати.');
    lines.push('');
    lines.push('🫡🤝🇺🇦');
    return lines;
}

}

function copyReport() {
    if(!state.selReport || !state.selDate) { showAlert('Виберіть звіт та день!'); return; }
    const dayRecs = state.records.filter(r=>r.reportNum===state.selReport && getDateOnly(r.datetime)===state.selDate);
    if(dayRecs.length===0) { showAlert('Немає записів!'); return; }
    const lines = generateReport(dayRecs);
    navigator.clipboard.writeText(lines.join('\n'));
    showAlert('✅ Скопійовано!');
}

function copyZvityPeriodReport() {
    if (!state.zvityFilterFrom || !state.zvityFilterTo) return;
    const _toYMD=s=>{const[d,m,y]=s.split('.');return y+m.padStart(2,'0')+d.padStart(2,'0');};
    const _recDT2=r=>{const p=(r.datetime||'').replace(',','').trim().split(/\s+/);const[d,m,y]=(p[0]||'').split('.');const t=(p[1]||'').substring(0,5)||'00:00';return (y||'').padStart(4,'0')+'-'+(m||'').padStart(2,'0')+'-'+(d||'').padStart(2,'0')+'T'+t;};
    const _fRecs=state.records.filter(r=>_recDT2(r)>=state.zvityFilterFrom&&_recDT2(r)<=state.zvityFilterTo);
    if(!_fRecs.length){showAlert('Вильотів за цей період не знайдено');return;}
    const _fPts=Math.round(_fRecs.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
    const _zFmt=s=>{const[dt,tm]=s.split('T');const[y,m,d]=dt.split('-');return (tm?tm+' ':'')+d+'.'+m+'.'+y;};
    const _fLabelFrom=_zFmt(state.zvityFilterFrom);
    const _fLabelTo=_zFmt(state.zvityFilterTo);
    const _fLabel=_fLabelFrom+' — '+_fLabelTo+'р.';
    const _lines=generateArchiveReport(_fRecs,_fLabel);
    _lines.push('Загалом уражено, орієнтовно на '+_fPts+' балів');
    navigator.clipboard.writeText(_lines.join('\n')).catch(()=>{});
    showAlert('✅ Скопійовано!');
}
function copyZvityAllReport() {
    const _recs=state.records;

function copyFilteredPeriodReport() {
    if (!state.filterFrom || !state.filterTo || !state.allArchiveLoaded) return;
    const _toYMD=s=>{const[d,m,y]=s.split('.');return y+m.padStart(2,'0')+d.padStart(2,'0');};
    const _fFrom=state.filterFrom.replace(/-/g,''), _fTo=state.filterTo.replace(/-/g,'');

    const _fLabelFrom=state.filterFrom.split('-').reverse().join('.');
    const _fLabelTo=state.filterTo.split('-').reverse().join('.');

    _fLines.push('Загалом уражено, орієнтовно на '+_fPts+' балів');

}

let _pck={yr:2026,mo:0,dy:null,hr:0,mn:0,hasTime:false,key:null,hrOpen:false,mnOpen:false};
function _pckOpen(key,hasTime,cur){
    const now=new Date();
    _pck.key=key;_pck.hasTime=hasTime;_pck.hrOpen=false;_pck.mnOpen=false;
    if(cur){
        const[dt,tm]=(cur||'').split('T');
        const pts=dt.split('-');
        _pck.yr=parseInt(pts[0])||now.getFullYear();
        _pck.mo=(parseInt(pts[1])||1)-1;
        _pck.dy=parseInt(pts[2])||null;
        if(tm){const tp=tm.split(':');_pck.hr=parseInt(tp[0])||0;_pck.mn=parseInt(tp[1])||0;}
        else{_pck.hr=hasTime?now.getHours():0;_pck.mn=hasTime?now.getMinutes():0;}
    } else {
        _pck.yr=now.getFullYear();_pck.mo=now.getMonth();_pck.dy=null;
        _pck.hr=hasTime?now.getHours():0;_pck.mn=hasTime?now.getMinutes():0;
    }
    _pckRender();
}
function _pckRender(){
    const p=_pck;
    const fd=(d=>(d===0?6:d-1))(new Date(p.yr,p.mo,1).getDay());

        const sel=p.dy===d;

    if(p.hasTime){
        const _hc=document.getElementById('_pckHrList');
        const _mc=document.getElementById('_pckMnList');
        if(_hc){const _s=_hc.querySelector('[data-sel]');if(_s)_hc.scrollTop=_s.offsetTop-_hc.clientHeight/2+_s.clientHeight/2;}

    }
}

        }).join('');
        h+=`<div class="p-4 space-y-4 zvity-wrap">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 8px 4px">
                <h1 class="stencil-shadow text-3xl" style="color:var(--yellow)">ВИЛЬОТИ</h1>
                ${_vyRecs.length>0?`<div class="stencil" style="font-size:calc(1.15em - 1px);margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 20px"><span style="color:var(--khaki);white-space:nowrap">ВИЛЬОТІВ ЗА ЗВІТ:&nbsp;<span style="color:var(--yellow)">${_vyRecs.length}</span></span><span style="color:var(--khaki);white-space:nowrap">БАЛІВ ЗА ЗВІТ:&nbsp;<span style="color:var(--yellow)">${_vyTotal}</span></span></div>`:''}
            </div>
            ${_vyGroups||'<div class="crate p-4"><p class="stencil text-center py-2" style="color:var(--text-dim)">Немає вильотів у поточному звіті</p></div>'}
        </div>`;
    }

    if(state.page==='reports') {
        const reps = [...new Set(state.records.map(r=>r.reportNum))].sort((a,b)=>a-b);
        const dates = state.selReport ? [...new Set(state.records.filter(r=>r.reportNum===state.selReport).map(r=>getDateOnly(r.datetime)))].sort() : [];
        const dayRecs = state.selReport && state.selDate ? state.records.filter(r=>r.reportNum===state.selReport && getDateOnly(r.datetime)===state.selDate) : [];
        const reportLines = dayRecs.length > 0 ? generateReport(dayRecs) : [];
        {
        let _zvPicker='';
        let _zvResult='';
        if(state.zvityFilterOpen){
            const _zBtnDis=(!state.zvityFilterFrom||!state.zvityFilterTo)?'disabled style="opacity:0.38;cursor:not-allowed;pointer-events:none"':'' ;
            _zvPicker='<div class="crate p-4"><div class="flex flex-wrap gap-3 items-end">'
                +'<div><label class="label block mb-1" style="font-size:0.85em">З</label>'
                +'<button onclick="_pckOpen(\'zvityFilterFrom\',true,state.zvityFilterFrom)" class="btn-stencil" style="min-width:155px;text-align:left;font-family:inherit;padding:7px 10px">'+(state.zvityFilterFrom?(()=>{const[dt,tm]=state.zvityFilterFrom.split('T');const[y,m,d]=dt.split('-');return d+'.'+m+'.'+y+(tm?' '+tm:'');})():'— оберіть —')+'</button></div>'
                +'<div><label class="label block mb-1" style="font-size:0.85em">ПО</label>'
                +'<button onclick="_pckOpen(\'zvityFilterTo\',true,state.zvityFilterTo)" class="btn-stencil" style="min-width:155px;text-align:left;font-family:inherit;padding:7px 10px">'+(state.zvityFilterTo?(()=>{const[dt,tm]=state.zvityFilterTo.split('T');const[y,m,d]=dt.split('-');return d+'.'+m+'.'+y+(tm?' '+tm:'');})():'— оберіть —')+'</button></div>'
                +'<button '+_zBtnDis+' onclick="state.zvityFilterShown=true;render()" onmousedown="this.classList.add(\'active\')" onmouseup="this.classList.remove(\'active\')" ontouchstart="this.classList.add(\'active\')" ontouchend="this.classList.remove(\'active\')" class="btn-stencil btn-yellow-dim">ПОКАЗАТИ</button>'
                +'</div></div>';
        }
        if(state.zvityFilterShown&&state.zvityFilterFrom&&state.zvityFilterTo){
            const _zRecDT=r=>{const p=(r.datetime||'').replace(',','').trim().split(/\s+/);const[d,m,y]=(p[0]||'').split('.');const t=(p[1]||'').substring(0,5)||'00:00';return (y||'').padStart(4,'0')+'-'+(m||'').padStart(2,'0')+'-'+(d||'').padStart(2,'0')+'T'+t;};
            const _zFrom=state.zvityFilterFrom,_zTo=state.zvityFilterTo;
            const _zRecs=state.records.filter(r=>_zRecDT(r)>=_zFrom&&_zRecDT(r)<=_zTo);
            const _zFmtDT=s=>{const[dt,tm]=s.split('T');const[y,m,d]=dt.split('-');return (tm?tm+' ':'')+d+'.'+m+'.'+y;};
            const _zFmtDTr=s=>{const[dt,tm]=s.split('T');const[y,m,d]=dt.split('-');return (tm?tm+' ':'')+d+'.'+m+'.'+y+'р.';};
            const _zLblFrom=_zFmtDT(state.zvityFilterFrom);
            const _zLblTo=_zFmtDT(state.zvityFilterTo);
            const _zLabel=_zLblFrom+' — '+_zLblTo+'р.';
            if(!_zRecs.length){
                _zvResult='<div class="crate p-4"><p class="stencil text-center py-4" style="color:var(--text-dim)">Вильотів за цей період не знайдено</p></div>';
            } else {
                const _zPts=Math.round(_zRecs.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
                // вильоти grouped by day
                const _zToYMD=s=>{const[d,m,y]=s.split('.');return(y||'')+(m||'').padStart(2,'0')+(d||'').padStart(2,'0');};
                const _zDates=[...new Set(_zRecs.map(r=>getDateOnly(r.datetime)))].sort((a,b)=>_zToYMD(a)>_zToYMD(b)?-1:1);
                const _zTotal=_zRecs.length;let _zN=0;
                const _zGroups=_zDates.map(d=>{
                    const dayR=[..._zRecs.filter(r=>getDateOnly(r.datetime)===d)].reverse();
                    const dayPts=Math.round(dayR.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
                    const cards=[...dayR].map(r=>formatRecord(r,_zTotal-_zN++)).join('');
                    return '<div class="crate p-4"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px"><h3 class="stencil-shadow" style="color:var(--yellow)">'+d+'</h3><span class="stencil" style="color:var(--khaki)">Вильотів: <span style="color:var(--yellow)">'+dayR.length+'</span>&nbsp;|&nbsp;Балів: <span style="color:var(--yellow)">'+dayPts+'</span></span></div><div class="space-y-2">'+cards+'</div></div>';
                }).join('');
                // доповідь combined for period
                const _zRepLines=generateReport(_zRecs);
                const _zReportTitle=state.reportTitle||'ТГ невідомий';
                _zRepLines[2]='з '+_zFmtDTr(state.zvityFilterFrom)+' по '+_zFmtDTr(state.zvityFilterTo)+',Тг., "'+_zReportTitle+'" здійснено '+_zRecs.length+' вильотів, уражено.';
                const _zHdrLabel='з '+_zFmtDT(state.zvityFilterFrom)+' по '+_zFmtDT(state.zvityFilterTo);
                const _zReports='<div class="crate p-4"><div class="flex justify-between items-center mb-3 flex-wrap gap-2"><h3 class="stencil-shadow" style="color:var(--yellow)">ДОПОВІДЬ '+_zHdrLabel+'</h3></div><div class="report-box">'+_zRepLines.join('\n')+'</div></div>';
                // підсумки
                const _zSumLines=generateArchiveReport(_zRecs,_zLabel);
                _zSumLines.push('Загалом уражено, орієнтовно на '+_zPts+' балів');
                const _zSumBlock='<div class="crate p-4"><div class="flex justify-between items-center mb-3 flex-wrap gap-2"><h3 class="stencil-shadow" style="color:var(--yellow)">ПІДСУМКИ ЗА ПЕРІОД</h3><button onclick="copyZvityPeriodReport()" onmousedown="this.classList.add(\'active\')" onmouseup="this.classList.remove(\'active\')" ontouchstart="this.classList.add(\'active\')" ontouchend="this.classList.remove(\'active\')" class="btn-stencil btn-black">КОПІЮВАТИ</button></div><div class="report-box">'+_zSumLines.join('\n')+'</div></div>';
                _zvResult=_zGroups+_zReports+_zSumBlock;
            }
        }
        h += `<div class="p-4 space-y-4 zvity-wrap">
            <div class="flex justify-between items-center px-2"><h1 onclick="state.selReport=null;state.selDate=null;state.zvityFilterOpen=false;state.zvityFilterShown=false;render()" class="stencil-shadow text-3xl" style="color:var(--yellow);cursor:pointer">ЗВІТИ</h1><span onclick="state.zvityFilterOpen=!state.zvityFilterOpen;state.zvityFilterShown=false;render()" onmousedown="this.style.color='var(--olive-bright)'" onmouseup="this.style.color=''" ontouchstart="this.style.color='var(--olive-bright)'" ontouchend="this.style.color=''" class="stencil" style="color:var(--khaki);cursor:pointer;font-size:1.1em">за період</span></div>
            ${state.zvityFilterOpen?'':`
            <div class="grid grid-cols-2 gap-4">
                <div class="crate p-4">
                    <h3 class="stencil-shadow mb-3" style="color: var(--yellow)">ЗВІТИ В TRINITY</h3>
                    <div class="flex flex-col gap-2">${reps.map((r,i)=>{const names=['ПЕРШИЙ','ДРУГИЙ','ТРЕТІЙ','ЧЕТВЕРТИЙ','П\'ЯТИЙ'];return `<button onclick="state.selReport=${r};state.selDate=null;render()" class="btn-stencil ${state.selReport===r?'btn-yellow':'btn-yellow-dim'}">${names[i]||'ЗВІТ '+r}</button>`}).join('') || '<p class="stencil text-center py-2" style="color: var(--text-dim)">Немає звітів</p>'}</div>
                </div>
                <div class="crate p-4">
                    <h3 class="stencil-shadow mb-3" style="color: var(--yellow)">ДНІ</h3>
                    <div class="flex flex-col gap-2">${state.selReport?(dates.map(d=>`<button onclick="state.selDate='${d}';render()" class="btn-stencil ${state.selDate===d?'btn-yellow':'btn-yellow-dim'}">${d}</button>`).join('') || '<p class="stencil text-center py-2" style="color: var(--text-dim)">Немає днів</p>'):'<p class="stencil text-center py-2" style="color: var(--text-dim)">Виберіть звіт</p>'}</div>
                </div>
            </div>
            ${(()=>{
  const _recs=state.selDate?dayRecs:(state.selReport?state.records.filter(r=>r.reportNum===state.selReport):state.records);
  if(!_recs.length)return '<div class="crate p-4"><p class="stencil text-center py-2" style="color:var(--text-dim)">Немає вильотів</p></div>';
  const _total=Math.round(_recs.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
  let _n=_recs.length;
  const _toYMD=s=>s.split('.').reverse().join('');
  const _dates=[...new Set(_recs.map(r=>getDateOnly(r.datetime)))].sort((a,b)=>_toYMD(a)<_toYMD(b)?-1:1).reverse();
  const _groups=_dates.map(d=>{
    const dayR=_recs.filter(r=>getDateOnly(r.datetime)===d);
    const cards=[...dayR].reverse().map(r=>formatRecord(r,_n--)).join('');
    const dayPts=Math.round(dayR.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
    return '<div class="crate p-4">'
      +(state.selDate?'':'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px"><h3 class="stencil-shadow" style="color:var(--yellow)">'+d+'</h3><span class="stencil" style="color:var(--khaki)">Вильотів: <span style="color:var(--yellow)">'+dayR.length+'</span>&nbsp;|&nbsp;Балів: <span style="color:var(--yellow)">'+dayPts+'</span></span></div>')
      +'<div class="space-y-2">'+cards+'</div></div>';
  }).join('');
  const _dc={};_recs.forEach(r=>{if(r.drone)_dc[r.drone]=(_dc[r.drone]||0)+1;});
  const _ac={};_recs.forEach(r=>{if(r.ammo)_ac[r.ammo]=(_ac[r.ammo]||0)+1;});
  const _rc={};_recs.forEach(r=>{if(r.result)r.result.split(', ').forEach(x=>{x=x.trim();if(x)_rc[x]=(_rc[x]||0)+1;});});
  const _row=(l,v,s='')=>'<p class="stencil" style="color:var(--text);margin:1px 0">'+l+' <span style="color:var(--yellow)">— '+v+s+'</span></p>';
  const _sec=(t,rows)=>rows?'<div style="margin-bottom:12px"><p class="stencil" style="color:var(--khaki);font-size:calc(0.85em + 2px);letter-spacing:0.08em;margin-bottom:4px">'+t+'</p>'+rows+'</div>':''
  const _dr=Object.entries(_dc).sort((a,b)=>b[1]-a[1]).map(([d,c])=>_row(esc(d),c,' шт')).join('');
  const _ar=Object.entries(_ac).sort((a,b)=>b[1]-a[1]).map(([a,c])=>_row(esc(a),c,' шт')).join('');
  const _pr=(state.pvr||[]).map(pvr=>{const t=Object.entries(pvr.map).reduce((s,[am,cf])=>s+(_ac[am]||0)*cf,0);return t?_row(esc(pvr.name),t+' кг'):''}).filter(Boolean).join('');
  const _rr=Object.entries(_rc).sort((a,b)=>b[1]-a[1]).map(([r,c])=>_row(esc(r),c,' разів')).join('');
  const _sh=(_dr||_ar||_pr||_rr)?'<div style="padding:20px 8px 4px"><div class="flex flex-wrap gap-4"><div class="space-y-3" style="flex:2 1 220px">'+_sec('ДРОНИ',_dr)+_sec('БОЄПРИПАСИ',_ar)+_sec('ПВР',_pr)+'</div><div style="flex:3 1 280px">'+_sec('РЕЗУЛЬТАТИ',_rr)+'</div></div></div>':''
  const _lbl=state.selDate?'ЗА ДЕНЬ':(state.selReport?'ЗА ЗВІТ':'ЗА ВИЇЗД');
  return '<div>'
    +'<p class="stencil" style="color:var(--khaki);font-size:calc(0.95em + 2px);padding:4px 8px 12px">'+_lbl+' ЗДІЙСНЕНО <span style="color:var(--text)">'+_recs.length+'</span> ВИЛЬОТІВ, ОРІЄНТОВНО НА <span style="color:var(--text)">'+_total+'</span> БАЛІВ</p>'
    +'<div class="space-y-4">'+(_groups||'<div class="crate p-4"><p class="stencil text-center py-2" style="color:var(--text-dim)">Немає вильотів</p></div>')+'</div>'+_sh+'</div>';
})()}
            ${dayRecs.length > 0 ? `<div class="crate p-4">
                <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
                    <div style="display:flex;align-items:center;gap:1.5em;flex-wrap:wrap">
                        <h3 class="stencil-shadow" style="color: var(--yellow)">ДОПОВІДЬ НА ${state.selDate}</h3>
                        <span class="stencil" style="color:var(--khaki)">Уражено орієнтовно на <span style="color:var(--text)">${Math.round(dayRecs.reduce((s,r)=>s+(parseFloat(r.points)||0),0))}</span> балів</span>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="copyReport()" onmousedown="this.classList.add('active')" onmouseup="this.classList.remove('active')" ontouchstart="this.classList.add('active')" ontouchend="this.classList.remove('active')" class="btn-stencil btn-black">КОПІЮВАТИ</button>
                    </div>
                </div>
                <div class="report-box">${reportLines.filter(l=>!l.startsWith('Уражено')).join('\n')}</div>
            </div>` : ''}
        `}
            ${_zvPicker}
            ${state.zvityFilterShown?_zvResult:''}
        </div>`;
        }
    }
    if(state.page==='reports'&&state.records.length>0&&!state.zvityFilterOpen){
        const _zvR=state.records;
        const _toYMD2=s=>{const[d,m,y]=s.split('.');return y+m.padStart(2,'0')+d.padStart(2,'0');};
        const _zvD=[...new Set(_zvR.map(r=>getDateOnly(r.datetime)).filter(Boolean))].sort((a,b)=>_toYMD2(a).localeCompare(_toYMD2(b)));
        if(_zvD.length){
            const[_d1,_m1,_y1]=_zvD[0].split('.'),[_d2,_m2,_y2]=_zvD[_zvD.length-1].split('.');
            const _zvP=(_m1===_m2&&_y1===_y2)?_d1+'-'+_d2+'.'+_m1+'.'+_y1+'р.':(_y1===_y2)?_d1+'.'+_m1+'-'+_d2+'.'+_m2+'.'+_y1+'р.':_zvD[0]+'р. — '+_zvD[_zvD.length-1]+'р.';
            const _zvT=Math.round(_zvR.reduce((s,r)=>s+(parseFloat(r.points)||0),0));
            const _zvL=generateArchiveReport(_zvR,_zvP);
            _zvL.push('Загалом уражено, орієнтовно на '+_zvT+' балів');
            h+='<div class="p-4 zvity-wrap">'
             +'<div class="crate p-4">'
             +'<div class="flex justify-between items-center mb-3 flex-wrap gap-2">'
             +'<h3 class="stencil-shadow" style="color:var(--yellow)">ПІДСУМКИ ЗА ВЕСЬ ПЕРІОД</h3>'
             +'<div class="flex gap-2 flex-wrap">'
             +'<button onclick="copyZvityAllReport()" onmousedown="this.classList.add(\'active\')" onmouseup="this.classList.remove(\'active\')" ontouchstart="this.classList.add(\'active\')" ontouchend="this.classList.remove(\'active\')" class="btn-stencil btn-black">КОПІЮВАТИ</button>'
             +'</div></div>'
             +'<div class="report-box">'+_zvL.join('\n')+'</div>'
             +'</div></div>';
        }
    }
    
    app.innerHTML = h;
}
    </script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/battle-reports/sw.js').catch(()=>{});
}
</script>
</body>
</html>
