plugins {
    id 'com.android.application'
}

android {
    namespace 'com.battlereports.local'
    compileSdk 34

    defaultConfig {
        applicationId 'com.battlereports.local'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {}
